<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificación Vista 5.0 · Multicines</title>
<style>
:root{
  --bg:#F4F6FA; --card:#FFFFFF; --navy:#1E2233; --gray:#3A3F4A; --grayLight:#6E747A;
  --border:#E7EAF2; --cian:#00AEEF; --morado:#7C3AED; --magenta:#EC008C; --naranja:#F5A623;
  --teal:#00B39A; --verde:#8BC34A; --verdeAmarillo:#FFD54F; --naranjaFuerte:#FB8C00; --rojo:#E53935;
  --cian-bg:rgba(0,174,239,0.10); --morado-bg:rgba(124,58,237,0.10); --magenta-bg:rgba(236,0,140,0.10);
  --naranja-bg:rgba(245,166,35,0.12); --teal-bg:rgba(0,179,154,0.12); --rojo-bg:rgba(229,57,53,0.10);
  --radius-s:6px; --radius-m:10px; --radius-l:16px;
  --shadow:0 10px 28px rgba(30,34,51,0.10); --shadow-sm:0 2px 8px rgba(30,34,51,0.06);
  --font: Arial, Helvetica, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{ background:var(--bg); color:var(--gray); font-family:var(--font); font-size:14px; line-height:1.5; min-height:100vh; }
#app{min-height:100vh;}
::selection{ background:var(--cian); color:#fff; }
a{color:inherit;}
button{font-family:inherit; cursor:pointer;}
input,textarea,select{font-family:inherit; font-size:14px;}
.hidden{display:none !important;}

.signature-bar{ height:4px; display:flex; }
.signature-bar span{ flex:1; }
.sb-cian{background:var(--cian);} .sb-morado{background:var(--morado);} .sb-magenta{background:var(--magenta);} .sb-naranja{background:var(--naranja);}

/* ============ LANDING ============ */
.landing-wrap{ min-height:100vh; background:var(--navy); display:flex; flex-direction:column; }
.landing-body{ flex:1; display:flex; align-items:center; justify-content:center; padding:32px; }
.landing-inner{ max-width:560px; text-align:center; }
.landing-logo{ height:38px; margin-bottom:36px; }
.landing-title{ color:#fff; font-size:30px; font-weight:700; margin:0 0 14px; line-height:1.25; }
.landing-desc{ color:#AEB4C4; font-size:15px; line-height:1.6; margin:0 0 40px; }
.role-cards{ display:flex; gap:16px; flex-wrap:wrap; justify-content:center; }
.role-card{
  flex:1; min-width:210px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.14);
  border-radius:var(--radius-l); padding:28px 22px; text-align:left; transition:all .15s ease;
}
.role-card:hover{ background:rgba(255,255,255,0.08); border-color:var(--cian); transform:translateY(-2px); }
.role-card-icon{ width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; margin-bottom:16px; }
.role-card-title{ color:#fff; font-size:16px; font-weight:700; margin:0 0 6px; }
.role-card-desc{ color:#AEB4C4; font-size:12.5px; line-height:1.5; margin:0; }
.landing-foot{ padding:22px 32px; text-align:center; }
.landing-foot span{ color:#6E7690; font-size:11.5px; }

/* ============ LOGIN ============ */
.login-wrap{ min-height:100vh; display:flex; flex-direction:column; background:var(--navy); }
.login-topbar{ padding:20px 28px; }
.back-link{ display:inline-flex; align-items:center; gap:7px; color:#AEB4C4; font-size:13px; font-weight:700; background:none; border:none; padding:6px 4px; }
.back-link:hover{ color:#fff; }
.login-body{ flex:1; display:flex; align-items:center; justify-content:center; padding:20px; }
.login-card{ width:100%; max-width:400px; background:var(--card); border-radius:var(--radius-l); padding:36px 32px; box-shadow:var(--shadow); }
.login-role-badge{ display:inline-flex; align-items:center; gap:7px; padding:5px 12px; border-radius:20px; font-size:11.5px; font-weight:700; margin-bottom:18px; }
.login-title{ font-size:22px; font-weight:700; color:var(--navy); margin:0 0 6px; }
.login-desc{ color:var(--grayLight); font-size:13px; margin:0 0 24px; }
.field{margin-bottom:16px;}
.field label{ display:block; font-size:12px; font-weight:700; color:var(--gray); margin-bottom:6px; }
.field input, .field select, .field textarea{
  width:100%; background:#fff; border:1.5px solid var(--border); color:var(--navy);
  padding:10px 12px; border-radius:var(--radius-s); outline:none; transition:border-color .15s ease;
}
.field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--cian); }
.field .hint{font-size:11px; color:var(--grayLight); margin-top:5px;}
.btn{ border:none; border-radius:var(--radius-s); padding:11px 18px; font-weight:700; font-size:13.5px; transition:all .15s ease; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
.btn-primary{ background:var(--cian); color:#fff; width:100%; }
.btn-primary:hover{ filter:brightness(1.08); box-shadow:0 4px 14px rgba(0,174,239,0.35); }
.btn-primary:disabled{ opacity:0.4; cursor:not-allowed; }
.btn-ghost{ background:none; color:var(--gray); border:1.5px solid var(--border); }
.btn-ghost:hover{ color:var(--navy); border-color:var(--grayLight); }
.btn-outline{ background:none; color:var(--cian); border:1.5px solid var(--cian); }
.btn-outline:hover{ background:var(--cian-bg); }
.btn-warn{ background:var(--naranjaFuerte); color:#fff; }
.btn-warn:hover{ filter:brightness(1.06); }
.btn-danger{ background:var(--rojo); color:#fff; }
.btn-danger:hover{ filter:brightness(1.06); }
.btn-sm{ padding:7px 13px; font-size:12px; }
.login-demo{ margin-top:20px; padding:12px 14px; background:var(--bg); border:1px dashed var(--border); border-radius:var(--radius-s); font-size:11px; color:var(--grayLight); line-height:1.7; }
.login-demo b{color:var(--gray);}
.error-msg{ color:var(--rojo); font-size:12px; margin:-6px 0 14px; font-weight:600; }
.login-demo-role{padding-top:4px; margin-top:6px; border-top:1px dashed var(--border);}

/* ============ APP SHELL ============ */
.topbar{ height:60px; background:var(--navy); display:flex; align-items:center; justify-content:space-between; padding:0 24px; position:sticky; top:0; z-index:40; }
.topbar-left{display:flex; align-items:center; gap:16px;}
.topbar-logo{ height:22px; }
.topbar-crumb{ font-size:12px; color:#AEB4C4; padding-left:16px; border-left:1px solid rgba(255,255,255,0.15); }
.topbar-right{display:flex; align-items:center; gap:16px;}
.user-chip{display:flex; align-items:center; gap:9px; font-size:12.5px; color:#D6DAE5;}
.avatar{ width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:11px; color:#fff; flex-shrink:0; }
.avatar-lg{ width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; color:#fff; flex-shrink:0; }
.bg-cian{background:var(--cian);} .bg-morado{background:var(--morado);} .bg-magenta{background:var(--magenta);} .bg-naranja{background:var(--naranja);} .bg-teal{background:var(--teal);}
.tp-btn{ background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.16); color:#fff; padding:7px 14px; border-radius:20px; font-size:12px; font-weight:700; }
.tp-btn:hover{ background:rgba(255,255,255,0.16); }

.body-shell{display:flex; flex:1; min-height:calc(100vh - 60px);}
.sidebar{ width:224px; background:var(--card); border-right:1px solid var(--border); padding:18px 12px; flex-shrink:0; }
.side-item{ display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:var(--radius-s); color:var(--gray); font-size:13.5px; font-weight:700; margin-bottom:3px; border:1px solid transparent; }
.side-item:hover{ background:var(--bg); }
.side-item.active{ background:var(--cian-bg); color:var(--cian); }
.side-icon{width:18px; text-align:center; font-size:14px;}

.content{flex:1; padding:28px 32px; max-width:1280px;}
.page-head{margin-bottom:22px;}
.page-title{ font-size:23px; font-weight:700; color:var(--navy); margin:0 0 5px; }
.page-sub{ color:var(--grayLight); font-size:13px; margin:0; max-width:760px; line-height:1.6; }

.panel{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius-l); padding:22px; box-shadow:var(--shadow-sm); }
.grid-4{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
.grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.grid-2{ display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
.stat-card{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius-m); padding:18px; box-shadow:var(--shadow-sm); }
.stat-num{ font-size:28px; font-weight:700; margin:0; color:var(--navy); }
.stat-label{ font-size:11.5px; color:var(--grayLight); margin-top:3px; font-weight:600; }

table{ width:100%; border-collapse:collapse; }
th{ text-align:left; font-size:11px; font-weight:700; color:var(--grayLight); padding:9px 12px; border-bottom:1.5px solid var(--border); text-transform:uppercase; letter-spacing:0.02em; }
td{ padding:11px 12px; border-bottom:1px solid var(--border); font-size:13.5px; color:var(--gray); }
tr:last-child td{ border-bottom:none; }
tr.row-hover:hover{ background:var(--bg); }

.tag{ display:inline-flex; align-items:center; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; }
.tag-cian{ background:var(--cian-bg); color:#0090C7; } .tag-morado{ background:var(--morado-bg); color:var(--morado); }
.tag-magenta{ background:var(--magenta-bg); color:var(--magenta); } .tag-naranja{ background:var(--naranja-bg); color:#B87200; }
.tag-teal{ background:var(--teal-bg); color:#00806E; } .tag-rojo{ background:var(--rojo-bg); color:var(--rojo); }
.tag-neutral{ background:var(--bg); color:var(--grayLight); border:1px solid var(--border); }

.progress-track{ height:8px; background:var(--bg); border-radius:20px; overflow:hidden; border:1px solid var(--border); }
.progress-fill{ height:100%; background:var(--cian); border-radius:20px; transition:width .3s ease; }
.progress-fill.pf-teal{ background:var(--teal); }
.progress-fill.pf-rojo{ background:var(--rojo); }

.toolbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:12px; flex-wrap:wrap; }
.toolbar-right{ display:flex; gap:10px; flex-wrap:wrap; }

.modal-overlay{ position:fixed; inset:0; background:rgba(20,22,33,0.55); backdrop-filter:blur(2px); display:flex; align-items:center; justify-content:center; z-index:100; padding:24px; }
.modal{ background:var(--card); border-radius:var(--radius-l); width:100%; max-width:520px; max-height:88vh; overflow-y:auto; padding:26px; box-shadow:var(--shadow); }
.modal-wide{ max-width:820px; }
.modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
.modal-title{ font-size:18px; font-weight:700; color:var(--navy); margin:0; }
.modal-close{ background:none; border:none; color:var(--grayLight); font-size:20px; line-height:1; padding:4px; }
.modal-close:hover{ color:var(--navy); }
.modal-foot{ display:flex; justify-content:flex-end; gap:10px; margin-top:22px; padding-top:18px; border-top:1px solid var(--border); }
.modal-warn-icon{ width:48px; height:48px; border-radius:50%; background:var(--naranja-bg); color:var(--naranjaFuerte); display:flex; align-items:center; justify-content:center; font-size:22px; margin:0 auto 16px; }

.toast{ position:fixed; bottom:26px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff; padding:11px 20px; border-radius:30px; font-size:13px; font-weight:700; box-shadow:var(--shadow); z-index:200; display:flex; align-items:center; gap:9px; opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease; }
.toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }
.toast-dot{width:7px; height:7px; border-radius:50%; background:var(--cian);}

.empty-state{ text-align:center; padding:50px 20px; color:var(--grayLight); }
.empty-state .es-icon{ font-size:32px; margin-bottom:12px; opacity:0.5; }
.empty-state .es-title{ color:var(--gray); font-size:14px; font-weight:700; margin-bottom:4px; }

.checkbox-row{ display:flex; align-items:center; gap:9px; }
.checkbox-row input{ width:16px; height:16px; accent-color:var(--cian); }
.icon-btn{ background:none; border:1px solid var(--border); color:var(--grayLight); width:26px; height:26px; border-radius:6px; font-size:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.icon-btn:hover{ color:var(--navy); border-color:var(--grayLight); }

.breadcrumbs{ display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--grayLight); margin-bottom:18px; flex-wrap:wrap; }
.breadcrumbs a{ color:var(--gray); cursor:pointer; font-weight:700; }
.breadcrumbs a:hover{ color:var(--cian); }
.breadcrumbs .sep{ opacity:0.5; }
.breadcrumbs .current{ color:var(--navy); font-weight:700; }

.filter-tabs{ display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
.filter-tab{ background:var(--card); border:1.5px solid var(--border); color:var(--gray); padding:8px 15px; border-radius:20px; font-size:12.5px; font-weight:700; }
.filter-tab:hover{ border-color:var(--cian); }
.filter-tab.active{ background:var(--navy); border-color:var(--navy); color:#fff; }

/* ============ tarjetas de módulo / catálogo ============ */
.cards-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:14px; }
.mod-card{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius-l); padding:20px; cursor:pointer; transition:all .15s ease; box-shadow:var(--shadow-sm); }
.mod-card:hover{ border-color:var(--cian); transform:translateY(-2px); box-shadow:var(--shadow); }
.mod-icon{ width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:19px; margin-bottom:14px; }
.mod-card-title{ font-weight:700; font-size:15px; color:var(--navy); margin-bottom:4px; }
.mod-card-meta{ font-size:11.5px; color:var(--grayLight); }

/* usuarios */
.user-card{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius-l); padding:18px; display:flex; flex-direction:column; gap:12px; box-shadow:var(--shadow-sm); transition:border-color .15s ease; }
.user-card:hover{ border-color:var(--cian); }
.user-card-top{ display:flex; align-items:center; gap:12px; }
.user-card-name{ font-weight:700; font-size:14.5px; color:var(--navy); }
.user-card-cargo{ font-size:12px; color:var(--grayLight); margin-top:1px; }
.user-card-mail{ font-size:11.5px; color:var(--grayLight); word-break:break-all; }
.user-card-foot{ display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:12px; border-top:1px solid var(--border); }
.user-card-tags{ display:flex; gap:6px; flex-wrap:wrap; }

/* resultados */
.progress-card{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius-l); padding:18px; cursor:pointer; transition:all .15s ease; box-shadow:var(--shadow-sm); }
.progress-card:hover{ border-color:var(--cian); transform:translateY(-1px); }
.progress-card-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:12px; }
.progress-card-title{ font-weight:700; font-size:14.5px; color:var(--navy); line-height:1.3; }
.progress-card-meta{ font-size:11.5px; color:var(--grayLight); margin-top:3px; }
.progress-card-pct{ font-size:21px; font-weight:700; color:var(--navy); flex-shrink:0; }
.progress-card-chips{ display:flex; gap:7px; margin-top:12px; flex-wrap:wrap; }

/* catálogo — detalle de módulo */
.sub-pill{ display:inline-flex; align-items:center; gap:6px; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-m); padding:10px 14px; margin:0 8px 8px 0; font-size:12.5px; font-weight:700; color:var(--gray); cursor:pointer; }
.sub-pill:hover{ border-color:var(--cian); color:var(--cian); }
.sub-pill.active{ background:var(--cian); border-color:var(--cian); color:#fff; }
.item-row{ display:flex; align-items:center; justify-content:space-between; padding:9px 12px; border-top:1px solid var(--border); font-size:13px; }
.item-row:first-child{ border-top:none; }
.item-row:hover{ background:var(--bg); }
.item-actions{ display:flex; gap:6px; opacity:0; transition:opacity .12s; }
.item-row:hover .item-actions{ opacity:1; }

/* picker de catálogo en esquemas */
.picker-tree{ max-height:460px; overflow-y:auto; border:1px solid var(--border); border-radius:var(--radius-m); padding:6px; }
.picker-mod{ border-bottom:1px solid var(--border); }
.picker-mod:last-child{border-bottom:none;}
.picker-mod-head{ display:flex; align-items:center; gap:9px; padding:10px 8px; font-weight:700; font-size:13px; color:var(--navy); }
.picker-sub-head{ display:flex; align-items:center; gap:9px; padding:7px 8px 7px 28px; font-weight:700; font-size:12px; color:var(--gray); }
.picker-item-row{ display:flex; align-items:center; gap:9px; padding:5px 8px 5px 48px; font-size:12px; color:var(--gray); }
.picker-item-row.taken{ opacity:0.55; }
.picker-item-taken-tag{ font-size:10px; color:var(--grayLight); margin-left:auto; }
.quick-assign{ background:none; border:none; color:var(--cian); font-size:11px; font-weight:700; margin-left:auto; padding:2px 6px; }
.quick-assign:hover{ text-decoration:underline; }

.paquete-card{ background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-m); padding:14px 16px; margin-bottom:10px; }
.paquete-card-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.paquete-name{ font-weight:700; font-size:13.5px; color:var(--navy); }
.paquete-meta{ font-size:11.5px; color:var(--grayLight); }
.paquete-users{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }

/* ============ certificación (usuario) ============ */
.cert-topbar{ position:sticky; top:60px; z-index:30; background:rgba(244,246,250,0.95); backdrop-filter:blur(6px); border-bottom:1px solid var(--border); padding:14px 32px; }
.cert-progress-row{ display:flex; align-items:center; gap:16px; max-width:1280px; }
.cert-progress-label{ font-size:12.5px; color:var(--navy); white-space:nowrap; font-weight:700; }
.cert-progress-track{ flex:1; }
.cert-progress-pct{ font-size:16px; font-weight:700; color:var(--cian); min-width:44px; text-align:right;}

.sub-block{ margin-bottom:28px; }
.sub-block-title{ font-size:12.5px; font-weight:700; color:var(--navy); margin:0 0 12px; padding-bottom:8px; border-bottom:2px solid var(--border); display:flex; align-items:center; gap:8px; text-transform:uppercase; letter-spacing:0.02em; }
.sub-block-count{ font-weight:600; color:var(--grayLight); text-transform:none; letter-spacing:0; font-size:11.5px; }

.item-card{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius-l); padding:18px 20px; margin-bottom:12px; box-shadow:var(--shadow-sm); }
.item-card-top{ display:flex; align-items:flex-start; gap:12px; margin-bottom:16px; }
.item-num{ width:24px; height:24px; border-radius:7px; background:var(--bg); color:var(--grayLight); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0; margin-top:1px; }
.item-name{ font-size:14px; font-weight:700; color:var(--navy); line-height:1.4; flex:1; }
.item-state-icon{ width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; flex-shrink:0; }

.eval-block{ background:var(--bg); border-radius:var(--radius-m); padding:14px 16px; margin-bottom:10px; }
.eval-block-label{ font-size:11.5px; font-weight:700; color:var(--gray); margin-bottom:10px; }
.eval-choice-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.eval-choice{ background:#fff; border:1.5px solid var(--border); border-radius:var(--radius-s); padding:11px 10px; font-size:12.5px; font-weight:700; color:var(--gray); display:flex; align-items:center; justify-content:center; gap:7px; transition:all .12s ease; }
.eval-choice:hover{ border-color:var(--grayLight); }
.eval-choice.on-teal{ background:var(--teal-bg); border-color:var(--teal); color:#00806E; }
.eval-choice.on-rojo{ background:var(--rojo-bg); border-color:var(--rojo); color:var(--rojo); }
.eval-choice.on-naranja{ background:var(--naranja-bg); border-color:var(--naranjaFuerte); color:#9A5B00; }
.eval-choice.on-neutral{ background:var(--bg); border-color:var(--grayLight); color:var(--gray); }

.item-comment-box{ background:var(--naranja-bg); border-radius:var(--radius-m); padding:14px 16px; margin-top:12px; display:grid; grid-template-columns:1fr auto; gap:14px; align-items:start; }
.item-comment-box.tone-rojo{ background:var(--rojo-bg); }
.item-comment-box textarea{ min-height:56px; resize:vertical; width:100%; border:1.5px solid transparent; background:#fff; border-radius:var(--radius-s); padding:9px 11px; outline:none; }
.item-comment-box textarea:focus{ border-color:var(--cian); }
.req-star{ color:var(--rojo); }
.file-btn{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; width:110px; height:56px; border:1.5px dashed var(--grayLight); border-radius:var(--radius-s); color:var(--grayLight); font-size:10.5px; text-align:center; position:relative; overflow:hidden; background:#fff; }
.file-btn input{ position:absolute; inset:0; opacity:0; cursor:pointer; }
.file-btn.has-file{ border-color:var(--teal); color:#00806E; border-style:solid; }

.readonly-banner{ display:flex; align-items:center; gap:12px; background:var(--teal-bg); border:1px solid var(--teal); border-radius:var(--radius-m); padding:14px 18px; margin-bottom:20px; }
.readonly-banner-icon{ width:32px; height:32px; border-radius:50%; background:var(--teal); color:#fff; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }
.ro-item-state{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; padding:6px 12px; border-radius:20px; }

/* tarjetas de campaña (usuario) */
.campaign-card{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius-l); padding:22px; box-shadow:var(--shadow-sm); transition:all .15s ease; display:flex; flex-direction:column; gap:16px; }
.campaign-card:hover{ box-shadow:var(--shadow); transform:translateY(-2px); }
.campaign-card-top{ display:flex; align-items:center; gap:14px; }
.campaign-ring-wrap{ position:relative; width:64px; height:64px; flex-shrink:0; }
.campaign-ring-pct{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; color:var(--navy); }
.campaign-title{ font-size:15.5px; font-weight:700; color:var(--navy); line-height:1.3; }
.campaign-meta{ font-size:11.5px; color:var(--grayLight); margin-top:3px; }
.campaign-stats{ display:flex; gap:8px; }
.campaign-cta{ margin-top:auto; }

.module-block{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius-l); padding:20px; margin-bottom:14px; box-shadow:var(--shadow-sm); }
.module-block-top{ display:flex; align-items:center; gap:14px; margin-bottom:14px; }
.module-block-title{ font-size:16px; font-weight:700; color:var(--navy); }
.module-block-meta{ font-size:11.5px; color:var(--grayLight); margin-top:2px; }
.sub-mini-row{ display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--border); }
.sub-mini-row:first-child{ border-top:none; }
.sub-mini-name{ width:200px; flex-shrink:0; font-size:12.5px; font-weight:600; color:var(--gray); }
.sub-mini-track{ flex:1; }
.sub-mini-pct{ font-size:11.5px; color:var(--grayLight); width:36px; text-align:right; }

.consol-summary{ display:flex; gap:14px; margin-bottom:22px; flex-wrap:wrap; }
.consol-chip{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius-m); padding:12px 18px; flex:1; min-width:120px; box-shadow:var(--shadow-sm); }
.consol-chip .n{ font-size:21px; font-weight:700; color:var(--navy); }
.consol-chip .l{ font-size:11px; color:var(--grayLight); margin-top:2px; font-weight:600; }

@media (max-width: 860px){
  .sidebar{ display:none; }
  .grid-4, .grid-3, .grid-2{ grid-template-columns:1fr; }
  .content{ padding:20px; }
  .cert-topbar, .topbar{ padding-left:16px; padding-right:16px; }
  .eval-choice-row{ grid-template-columns:1fr; }
  .role-cards{ flex-direction:column; }
}

/* ============ buscador ============ */
.search-wrap{ position:relative; margin-bottom:16px; }
.search-wrap input{ width:100%; background:#fff; border:1.5px solid var(--border); color:var(--navy); padding:10px 14px 10px 34px; border-radius:var(--radius-m); outline:none; font-size:13px; }
.search-wrap input:focus{ border-color:var(--cian); }
.search-wrap::before{ content:'🔍'; position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:12px; opacity:0.55; }

/* ============ tarjetas con falla resaltada / listas para producción ============ */
.progress-card.has-fail{ border-left:3px solid var(--rojo); }
.progress-card.is-ready{ border-left:3px solid var(--teal); }

/* ============ tarjeta bloqueada / reabierta ============ */
.locked-ribbon{ display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700; color:var(--grayLight); background:var(--bg); border:1px solid var(--border); border-radius:20px; padding:3px 10px; margin-bottom:8px; }
.item-card.reabierto{ border:1.5px solid var(--naranjaFuerte); }

/* ============ banners de estado ============ */
.banner{ display:flex; align-items:center; justify-content:space-between; gap:14px; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-m); padding:14px 18px; margin-bottom:18px; flex-wrap:wrap; }
.banner.banner-naranja{ border-color:var(--naranjaFuerte); background:var(--naranja-bg); }
.banner.banner-teal{ border-color:var(--teal); background:var(--teal-bg); }
.banner-text{ font-size:13px; color:var(--gray); }
.banner-text b{ display:block; font-size:13.5px; margin-bottom:2px; color:var(--navy); }

/* ============ tarjetas de solicitud de reapertura ============ */
.request-card{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius-l); padding:16px 18px; margin-bottom:12px; box-shadow:var(--shadow-sm); }
.request-card-top{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:8px; }
.request-card-msg{ font-size:12.5px; color:var(--gray); background:var(--bg); border-radius:var(--radius-s); padding:10px 12px; margin:8px 0 12px; }
.request-card-actions{ display:flex; gap:8px; flex-wrap:wrap; }

/* ============ diagrama comparativo pruebas vs producción ============ */
.diagram-mod{ margin-bottom:34px; }
.diagram-mod-head{ display:flex; align-items:center; gap:12px; margin-bottom:16px; }
.diagram-legend{ display:flex; gap:16px; font-size:11.5px; color:var(--gray); margin-bottom:20px; flex-wrap:wrap; }
.diagram-legend span{ display:flex; align-items:center; gap:6px; }
.dot{ width:8px; height:8px; border-radius:50%; }
.dot-teal{background:var(--teal);} .dot-rojo{background:var(--rojo);} .dot-gray{background:var(--grayLight);}
.diagram-children{ display:flex; gap:20px; flex-wrap:wrap; padding-top:14px; border-top:1.5px solid var(--border); }
.diagram-node{ display:flex; flex-direction:column; align-items:center; gap:8px; width:120px; }
.env-split{ display:flex; width:100%; height:52px; border-radius:12px; overflow:hidden; border:1px solid var(--border); cursor:pointer; transition:transform .1s ease; box-shadow:var(--shadow-sm); }
.env-split:hover{ transform:translateY(-2px); }
.env-half{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; }
.env-half-label{ font-size:8.5px; font-weight:800; letter-spacing:0.03em; opacity:0.8; }
.env-half-pct{ font-size:12px; font-weight:700; }
.env-half.st-ok{ background:var(--teal-bg); color:#00806E; }
.env-half.st-fail{ background:var(--rojo-bg); color:var(--rojo); }
.env-half.st-pending{ background:var(--bg); color:var(--grayLight); }
.env-half.st-na{ background:repeating-linear-gradient(135deg, var(--bg), var(--bg) 4px, var(--card) 4px, var(--card) 8px); color:var(--grayLight); }
.diagram-node-label{ font-size:11px; font-weight:600; text-align:center; line-height:1.3; color:var(--gray); }
.env-compare-row{ display:flex; align-items:center; gap:14px; padding:12px 16px; border-bottom:1px solid var(--border); }
.env-compare-row:last-child{ border-bottom:none; }
.env-compare-name{ flex:1.4; font-size:13px; font-weight:600; color:var(--navy); }
.env-compare-side{ flex:1; display:flex; align-items:center; gap:8px; }
.env-compare-side-label{ font-size:10px; font-weight:700; color:var(--grayLight); width:70px; }

/* ============ gestión de certificación (Mis resultados) ============ */
.mgmt-card{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius-l); padding:18px 20px; margin-bottom:14px; box-shadow:var(--shadow-sm); }
.mgmt-card-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:12px; flex-wrap:wrap; }
.mgmt-title{ font-weight:700; font-size:15px; color:var(--navy); }
.mgmt-meta{ font-size:12px; color:var(--grayLight); margin-top:2px; }
.mgmt-actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }

/* ============ semáforo gráfico ============ */
.semaphore{ display:inline-flex; flex-direction:column; gap:4px; background:#1E2233; border-radius:9px; padding:6px; flex-shrink:0; }
.semaphore-light{ width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,0.14); display:block; }
.semaphore-light.light-red.active{ background:#FF4D4D; box-shadow:0 0 7px #FF4D4D; }
.semaphore-light.light-yellow.active{ background:#FFC93C; box-shadow:0 0 7px #FFC93C; }
.semaphore-light.light-green.active{ background:#00E0A4; box-shadow:0 0 7px #00E0A4; }
.semaphore-lg{ padding:10px; border-radius:14px; gap:7px; }
.semaphore-lg .semaphore-light{ width:15px; height:15px; }
.semaphore-row{ display:flex; align-items:center; gap:12px; }

async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      const saved = JSON.parse(res.value);
      STATE = Object.assign(DEFAULT_STATE(), saved);
    }
  }catch(e){ /* sin estado guardado — se usa el seed */ }
  if(!STATE.schemes || STATE.schemes.length===0){
    STATE.schemes = JSON.parse(JSON.stringify(SEED_SCHEMES));
    STATE.certs = Object.assign({}, STATE.certs, JSON.parse(JSON.stringify(SEED_CERTS)));
  }
  buildItemIndex();
}

function logAudit(schemeId, itemId, itemNombre, tipo, valor){

function isItemEditable(schemeId, userId, itemId){
  const sub = STATE.submissions[schemeId+'::'+userId];
  if(!sub || !sub.enviado) return true;
  if(sub.reabiertoTotal) return true;
  if(sub.reabiertos && sub.reabiertos.includes(itemId)) return true;
  return false;
}

function approveReopenRequest(reqId, alcance){
  const req = STATE.reopenRequests.find(r=>r.id===reqId); if(!req) return;
  const key = req.schemeId+'::'+req.userId;
  const sub = STATE.submissions[key];
  if(!sub){ req.estado='rechazado'; req.fechaResolucion=new Date().toLocaleString('es-EC'); persist(true); render(); return; }
  const sch = findScheme(req.schemeId);
  if(alcance==='todo'){
    sub.enviado = false;
    sub.reabiertos = [];
  } else {
    const ids = itemIdsForUser(sch, req.userId);
    const target = ids.filter(id=>{ const c=(STATE.certs[sch.id]||{})[id]; return !c || !c.estado || c.estado==='fail'; });
    target.forEach(id=>{ if(!STATE.certs[sch.id]) STATE.certs[sch.id]={}; STATE.certs[sch.id][id] = {estado:null, cambio:null, comentario:'', evidencia:null}; });
    sub.reabiertos = target;
  }
  req.estado='aprobado'; req.alcance=alcance; req.fechaResolucion=new Date().toLocaleString('es-EC');
  if(!STATE.auditLog[req.schemeId]) STATE.auditLog[req.schemeId]=[];
  STATE.auditLog[req.schemeId].push({userId:SESSION.userId, itemId:null, itemNombre: alcance==='todo'?'todo el esquema':'los ítems fallidos/pendientes', tipo:'reapertura', valor:alcance, ts:new Date().toISOString()});
  persist(true); toast('Reapertura aprobada'); render();
}

}

function circularProgress(pct, size, colorVar){
  size = size||64;
  const stroke = 6, r = (size-stroke)/2, c = 2*Math.PI*r, off = c*(1-pct/100);
  colorVar = colorVar || (pct===100?'var(--teal)':'var(--cian)');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">

    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${colorVar}" stroke-width="${stroke}"

  </svg>`;
}

/* ============== asignación / progreso (modelo de paquetes) ============== */

function allItemIdsInScheme(scheme){
  const s = new Set();
  scheme.paquetes.forEach(pq=>pq.itemIds.forEach(id=>s.add(id)));
  return [...s];
}
function itemIdsForUser(scheme, userId){
  const s = new Set();
  scheme.paquetes.forEach(pq=>{ if(pq.userIds.includes(userId)) pq.itemIds.forEach(id=>s.add(id)); });
  return [...s];
}
function responsablesOfItem(scheme, itemId){
  const s = new Set();
  scheme.paquetes.forEach(pq=>{ if(pq.itemIds.includes(itemId)) pq.userIds.forEach(u=>s.add(u)); });
  return [...s];
}
function schemesForUser(userId){
  return STATE.schemes.filter(sch=>sch.paquetes.some(pq=>pq.userIds.includes(userId) && pq.itemIds.length));
}
function certFor(schemeId, itemId){
  if(!STATE.certs[schemeId]) STATE.certs[schemeId]={};
  if(!STATE.certs[schemeId][itemId]) STATE.certs[schemeId][itemId]={estado:null, cambio:null, comentario:'', evidencia:null};
  return STATE.certs[schemeId][itemId];
}
function progressOfItemIds(scheme, itemIds){
  let done=0, ok=0, fail=0;
  itemIds.forEach(id=>{ const c=(STATE.certs[scheme.id]||{})[id]; if(c&&c.estado){ done++; c.estado==='ok'?ok++:fail++; } });
  return {total:itemIds.length, done, ok, fail, pct:itemIds.length?Math.round(done/itemIds.length*100):0};
}
// agrupa los itemIds de un usuario en un esquema por Módulo -> Submódulo, en el orden del catálogo
function groupedForUser(scheme, userId){
  const ids = new Set(itemIdsForUser(scheme, userId));
  const out = [];
  STATE.catalog.forEach(m=>{
    const subsOut = [];
    m.submodulos.forEach(s=>{
      const items = s.items.filter(it=>ids.has(it.id));
      if(items.length) subsOut.push({sub:s, items});
    });
    if(subsOut.length) out.push({modulo:m, subs:subsOut});
  });
  return out;
}
function isLocked(schemeId, userId){
  const sub = STATE.submissions[schemeId+'::'+userId];
  return !!(sub && sub.enviado);
}

  const app = document.getElementById('app');
  if(!SESSION){
    if(NAV.view==='landing'){ app.innerHTML = renderLanding(); attachLandingEvents(); return restoreFocus(); }
    if(NAV.view==='login'){ app.innerHTML = renderLogin(); attachLoginEvents(); return restoreFocus(); }
  }
  if(SESSION && SESSION.forceChange){ app.innerHTML = renderForceChange(); attachForceChangeEvents(); return restoreFocus(); }
  if(SESSION && SESSION.role==='admin'){ app.innerHTML = renderAdminShell(); attachAdminEvents(); return restoreFocus(); }
  if(SESSION && SESSION.role==='user'){ app.innerHTML = renderUserShell(); attachUserEvents(); return restoreFocus(); }
  app.innerHTML = renderLanding(); attachLandingEvents();

  function restoreFocus(){
    if(activeId){
      const el = document.getElementById(activeId);
      if(el && (el.tagName==='INPUT' || el.tagName==='TEXTAREA')){
        el.focus();
        if(selStart!==null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selStart); }catch(e){} }
      }
    }
  }
}

let RESULTS_TAB = 'global';
let RESULTS_NAV = {};

function allFlatEntries(){
  // una fila por (esquema, ítem asignado) — con su módulo/submódulo/estado
  const out = [];
  STATE.schemes.forEach(sch=>{
    allItemIdsInScheme(sch).forEach(id=>{
      const idx = ITEM_INDEX[id]; if(!idx) return;
      const cert = (STATE.certs[sch.id]||{})[id] || {};
      out.push({scheme:sch, item:idx.item, sub:idx.sub, modulo:idx.modulo, cert, resp:responsablesOfItem(sch,id)});
    });
  });
  return out;
}
function progressCard(opts){
  const cls = opts.pct===100 && opts.fail===0 ? 'is-ready' : (opts.fail>0 ? 'has-fail' : '');
  const r = readiness(opts.pct, opts.fail);
  return `<div class="progress-card ${cls}" ${opts.navAttr||''}>
    <div class="progress-card-top">
      <div><div class="progress-card-title">${opts.title}</div>${opts.meta?`<div class="progress-card-meta">${opts.meta}</div>`:''}</div>
      <div style="display:flex; align-items:center; gap:8px;">${semaphoreHtml(r.light, {title:r.label})}<div class="progress-card-pct">${opts.pct}%</div></div>
    </div>
    <div class="progress-track"><div class="progress-fill ${opts.pct===100?'pf-teal':''}" style="width:${opts.pct}%"></div></div>
    <div class="progress-card-chips"><span class="tag tag-teal">${opts.ok} bien</span><span class="tag ${opts.fail>0?'tag-rojo':'tag-neutral'}">${opts.fail>0?'⚠ ':''}${opts.fail} con fallas</span></div>
  </div>`;
}
function resultsFilterTabs(){

let COMPARE_SELECTED = null; // "moduloId::subId"

function subIdsInSchemeForModulo(scheme, moduloId){
  return [...new Set(allItemIdsInScheme(scheme).filter(id=>ITEM_INDEX[id].modulo.id===moduloId).map(id=>ITEM_INDEX[id].sub.id))];
}
function computeCompareData(){
  const moduloIds = [...new Set(STATE.schemes.flatMap(sch=>allItemIdsInScheme(sch).map(id=>ITEM_INDEX[id].modulo.id)))];
  return moduloIds.map(modId=>{
    const modulo = findModulo(modId);
    const schPruebas = STATE.schemes.find(s=>s.ambiente==='Pruebas' && allItemIdsInScheme(s).some(id=>ITEM_INDEX[id].modulo.id===modId));
    const schProd = STATE.schemes.find(s=>s.ambiente==='Producción' && allItemIdsInScheme(s).some(id=>ITEM_INDEX[id].modulo.id===modId));
    const subIds = new Set([
      ...(schPruebas?subIdsInSchemeForModulo(schPruebas, modId):[]),
      ...(schProd?subIdsInSchemeForModulo(schProd, modId):[]),
    ]);
    const subs = modulo.submodulos.filter(s=>subIds.has(s.id));
    return {modulo, schPruebas, schProd, subs};
  }).filter(d=>d.subs.length);
}
function subEnvStatus(scheme, sub){
  if(!scheme) return {status:'na', pct:0, ok:0, fail:0};
  const ids = allItemIdsInScheme(scheme).filter(id=>ITEM_INDEX[id].sub.id===sub.id);
  if(!ids.length) return {status:'na', pct:0, ok:0, fail:0};
  const p = progressOfItemIds(scheme, ids);
  let status = 'pending';
  if(p.fail>0) status='fail'; else if(p.pct===100) status='ok';
  return {status, pct:p.pct, ok:p.ok, fail:p.fail};
}
function renderResultsComparar(){
  const data = computeCompareData();
  if(!data.length){
    return `<div class="panel"><div class="empty-state"><div class="es-icon">🧭</div><div class="es-title">Todavía no hay nada que comparar</div>Crea esquemas para el mismo módulo en Pruebas y en Producción para verlos lado a lado.</div></div>`;
  }
  const blocks = data.map(d=>{
    const nodes = d.subs.map(s=>{
      const stP = subEnvStatus(d.schPruebas, s), stD = subEnvStatus(d.schProd, s);
      return `<div class="diagram-node">
        <div class="env-split" data-compare-sub="${d.modulo.id}::${s.id}">
          <div class="env-half st-${stP.status}"><span class="env-half-label">PRUEBAS</span><span class="env-half-pct">${stP.status==='na'?'—':stP.pct+'%'}</span></div>
          <div class="env-half st-${stD.status}"><span class="env-half-label">PROD.</span><span class="env-half-pct">${stD.status==='na'?'—':stD.pct+'%'}</span></div>
        </div>
        <div class="diagram-node-label">${s.nombre}</div>
      </div>`;
    }).join('');
    return `<div class="diagram-mod">
      <div class="diagram-mod-head">
        <div class="mod-icon bg-${accentFor(d.modulo.id)}" style="margin-bottom:0;">${moduloIcon(d.modulo.nombre)}</div>
        <div><div style="font-weight:700; font-size:15.5px; color:var(--navy);">${d.modulo.nombre}</div><div style="font-size:11.5px; color:var(--grayLight);">${d.schPruebas?'✓ tiene esquema de Pruebas':'sin esquema de Pruebas'} · ${d.schProd?'✓ tiene esquema de Producción':'sin esquema de Producción'}</div></div>
      </div>
      <div class="diagram-children">${nodes}</div>
    </div>`;
  }).join('');

  let detail = '';
  if(COMPARE_SELECTED){
    const [modId, subId] = COMPARE_SELECTED.split('::');
    const entry = data.find(d=>d.modulo.id===modId);
    const sub = entry ? entry.subs.find(s=>s.id===subId) : null;
    if(entry && sub){
      const items = sub.items;
      const rows = items.map(it=>{
        const cP = entry.schPruebas ? (STATE.certs[entry.schPruebas.id]||{})[it.id] : null;
        const cD = entry.schProd ? (STATE.certs[entry.schProd.id]||{})[it.id] : null;
        const chip = (c)=> !c||!c.estado ? '<span class="tag tag-neutral">Sin dato</span>' : c.estado==='ok' ? '<span class="tag tag-teal">Funciona</span>' : '<span class="tag tag-rojo">No funciona</span>';
        return `<div class="env-compare-row">
          <span class="env-compare-name">${it.nombre}</span>
          <span class="env-compare-side"><span class="env-compare-side-label">PRUEBAS</span>${chip(cP)}</span>
          <span class="env-compare-side"><span class="env-compare-side-label">PRODUCCIÓN</span>${chip(cD)}</span>
        </div>`;
      }).join('');
      detail = `<div class="panel" style="margin-top:6px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <p style="font-weight:700; font-size:13.5px; color:var(--navy); margin:0;">${sub.nombre} — comparación ítem por ítem</p>
          <button class="icon-btn" id="closeCompareDetail" title="Cerrar">✕</button>
        </div>
        ${rows}
      </div>`;
    }
  }
  return `
    <div class="diagram-legend">
      <span><span class="dot dot-teal"></span> Funciona / 100%</span>
      <span><span class="dot dot-rojo"></span> Con fallas</span>
      <span><span class="dot dot-gray"></span> En progreso</span>
      <span style="opacity:0.7;">▨ Sin esquema en ese ambiente todavía</span>
    </div>
    ${blocks}
    ${detail}`;
}

function renderResultsModuloCross(flat){

      const ok=g.items.filter(f=>f.cert.estado==='ok').length, fail=g.items.filter(f=>f.cert.estado==='fail').length;
      const pct = g.items.length?Math.round((ok+fail)/g.items.length*100):0;
      return progressCard({navAttr:`data-drill-cross-modulo="${g.modulo.id}"`, title:`${moduloIcon(g.modulo.nombre)} ${g.modulo.nombre}`, meta:`en ${new Set(g.items.map(f=>f.scheme.id)).size} esquema(s)`, pct, ok, fail});
    }).join('');
    return `<div class="cards-grid" style="grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));">${cards}</div>`;

  const m = findModulo(RESULTS_NAV.crossModuloId);

function renderResultsFlatList(entries, emptyMsg){

    return `<tr><td>${u?u.nombre+' '+u.apellido:'—'}</td><td>${TIPO_LABEL[e.tipo]||e.tipo} "${e.itemNombre||sch.nombre}"</td><td>${valorTxt}</td><td style="color:var(--grayLight); font-size:12px;">${fecha}</td></tr>`;
  }).join('');
  return `
    <div class="modal-head"><h3 class="modal-title">Historial — ${sch.nombre}</h3><button class="modal-close" id="modalClose">✕</button></div>
    ${log.length ? `<table><thead><tr><th>Quién</th><th>Acción</th><th>Valor</th><th>Fecha</th></tr></thead><tbody>${rows}</tbody></table>` : `<div class="empty-state"><div class="es-title">Todavía no hay movimientos registrados</div></div>`}
    <div class="modal-foot"><button class="btn btn-ghost" id="modalCancel">Cerrar</button></div>`;
}
function renderModalRequestReopen(){
  return `
    <div class="modal-head"><h3 class="modal-title">Solicitar reapertura</h3><button class="modal-close" id="modalClose">✕</button></div>

    <div class="modal-foot"><button class="btn btn-ghost" id="modalCancel">Cancelar</button><button class="btn btn-primary" id="reqSave">Enviar solicitud</button></div>`;

function attachViewSpecificEvents(){
  document.querySelectorAll('[data-nav]').forEach(el=>{ el.onclick=()=>{ NAV={view:el.dataset.nav}; render(); }; });

  /* ---- usuarios ---- */
  const newUserBtn=document.getElementById('newUserBtn'); if(newUserBtn) newUserBtn.onclick=()=>{ MODAL={open:true, kind:'new-user'}; render(); };
  document.querySelectorAll('[data-edit-user]').forEach(el=>{ el.onclick=()=>{ MODAL={open:true, kind:'edit-user', payload:findUser(el.dataset.editUser)}; render(); }; });
  document.querySelectorAll('[data-del-user]').forEach(el=>{ el.onclick=()=>{ if(confirm('¿Eliminar este usuario?')){ STATE.users=STATE.users.filter(u=>u.id!==el.dataset.delUser); persist(true); render(); } }; });

  /* ---- catálogo ---- */
  document.querySelectorAll('[data-open-catalog-detail]').forEach(el=>{ el.onclick=()=>{ CATALOG_SUB_OPEN=null; NAV={view:'admin-catalog-detail', moduloId:el.dataset.openCatalogDetail}; render(); }; });
  const catalogSearch = document.getElementById('catalogSearch');
  if(catalogSearch) catalogSearch.oninput = ()=>{ CATALOG_QUERY = catalogSearch.value; render(); };
  document.querySelectorAll('[data-open-sub]').forEach(el=>{ el.onclick=()=>{ CATALOG_SUB_OPEN = CATALOG_SUB_OPEN===el.dataset.openSub ? null : el.dataset.openSub; render(); }; });
  const newModBtn=document.getElementById('newModBtn'); if(newModBtn) newModBtn.onclick=()=>{ MODAL={open:true, kind:'new-mod'}; render(); };
  const addSubBtn=document.getElementById('addSubBtn'); if(addSubBtn) addSubBtn.onclick=()=>{ MODAL={open:true, kind:'add-sub', payload:{moduloId:NAV.moduloId}}; render(); };
  const delModBtn=document.getElementById('delModBtn'); if(delModBtn) delModBtn.onclick=()=>{ if(confirm('¿Eliminar este módulo completo, con todas sus secciones e ítems?')){ STATE.catalog=STATE.catalog.filter(m=>m.id!==NAV.moduloId); persist(true); buildItemIndex(); NAV={view:'admin-catalog'}; render(); } };
  document.querySelectorAll('[data-add-item]').forEach(el=>{ el.onclick=()=>{ MODAL={open:true, kind:'add-item', payload:{subId:el.dataset.addItem}}; render(); }; });
  document.querySelectorAll('[data-del-sub]').forEach(el=>{ el.onclick=()=>{ if(confirm('¿Eliminar esta sección y sus ítems?')){ STATE.catalog.forEach(m=>m.submodulos=m.submodulos.filter(s=>s.id!==el.dataset.delSub)); persist(true); buildItemIndex(); CATALOG_SUB_OPEN=null; render(); } }; });
  document.querySelectorAll('[data-edit-item]').forEach(el=>{ el.onclick=()=>{ let target=null; STATE.catalog.forEach(m=>m.submodulos.forEach(s=>s.items.forEach(it=>{ if(it.id===el.dataset.editItem) target=it; }))); MODAL={open:true, kind:'edit-item', payload:target}; render(); }; });
  document.querySelectorAll('[data-del-item]').forEach(el=>{ el.onclick=()=>{ if(confirm('¿Eliminar este ítem?')){ STATE.catalog.forEach(m=>m.submodulos.forEach(s=>s.items=s.items.filter(it=>it.id!==el.dataset.delItem))); persist(true); buildItemIndex(); render(); } }; });

  /* ---- esquemas ---- */
  const newSchemeBtn=document.getElementById('newSchemeBtn'); if(newSchemeBtn) newSchemeBtn.onclick=openSchemeEditor;
  document.querySelectorAll('[data-open-scheme-results]').forEach(el=>{ el.onclick=()=>{ RESULTS_TAB='campana'; RESULTS_NAV={schemeId:el.dataset.openSchemeResults}; NAV={view:'admin-results'}; render(); }; });
  const schNombreEl=document.getElementById('schNombre'); if(schNombreEl) schNombreEl.oninput=()=>{ SCHEME_DRAFT.nombre=schNombreEl.value; };
  const schAmbienteEl=document.getElementById('schAmbiente'); if(schAmbienteEl) schAmbienteEl.onchange=()=>{ SCHEME_DRAFT.ambiente=schAmbienteEl.value; };
  document.querySelectorAll('[data-toggle-picker]').forEach(el=>{ el.onclick=()=>{ const id=el.dataset.togglePicker; PICKER_OPEN[id]=!PICKER_OPEN[id]; render(); }; });
  document.querySelectorAll('[data-picker-item-check]').forEach(el=>{ el.onchange=()=>{ const id=el.dataset.pickerItemCheck; el.checked?STAGING_SELECTED.add(id):STAGING_SELECTED.delete(id); render(); }; });
  document.querySelectorAll('[data-picker-sub-check]').forEach(el=>{
    el.onchange=()=>{ const sub=STATE.catalog.flatMap(m=>m.submodulos).find(s=>s.id===el.dataset.pickerSubCheck); const taken=itemsTakenMap();
      sub.items.forEach(it=>{ if(taken[it.id]) return; el.checked?STAGING_SELECTED.add(it.id):STAGING_SELECTED.delete(it.id); }); render(); }; });
  document.querySelectorAll('[data-picker-mod-check]').forEach(el=>{
    el.onchange=()=>{ const m=findModulo(el.dataset.pickerModCheck); const taken=itemsTakenMap();
      m.submodulos.forEach(s=>s.items.forEach(it=>{ if(taken[it.id]) return; el.checked?STAGING_SELECTED.add(it.id):STAGING_SELECTED.delete(it.id); })); render(); }; });
  document.querySelectorAll('[data-quick-assign-mod]').forEach(el=>{
    el.onclick=()=>{ const m=findModulo(el.dataset.quickAssignMod); const taken=itemsTakenMap();
      STAGING_SELECTED = new Set(m.submodulos.flatMap(s=>s.items.map(it=>it.id)).filter(id=>!taken[id]));
      MODAL={open:true, kind:'create-paquete', payload:{nombre:m.nombre}}; render(); }; });
  document.querySelectorAll('[data-quick-assign-sub]').forEach(el=>{
    el.onclick=()=>{ const sub=STATE.catalog.flatMap(m=>m.submodulos).find(s=>s.id===el.dataset.quickAssignSub); const taken=itemsTakenMap();
      STAGING_SELECTED = new Set(sub.items.map(it=>it.id).filter(id=>!taken[id]));
      MODAL={open:true, kind:'create-paquete', payload:{nombre:sub.nombre}}; render(); }; });
  const createPaqueteBtn=document.getElementById('createPaqueteBtn'); if(createPaqueteBtn) createPaqueteBtn.onclick=()=>{ MODAL={open:true, kind:'create-paquete', payload:{}}; render(); };
  document.querySelectorAll('[data-edit-paquete]').forEach(el=>{ el.onclick=()=>{ const pq=SCHEME_DRAFT.paquetes.find(p=>p.id===el.dataset.editPaquete); MODAL={open:true, kind:'create-paquete', payload:{editId:pq.id, nombre:pq.nombre, userIds:pq.userIds}}; render(); }; });
  document.querySelectorAll('[data-del-paquete]').forEach(el=>{ el.onclick=()=>{ SCHEME_DRAFT.paquetes = SCHEME_DRAFT.paquetes.filter(p=>p.id!==el.dataset.delPaquete); render(); }; });
  const saveSchemeBtn=document.getElementById('saveSchemeBtn');
  if(saveSchemeBtn) saveSchemeBtn.onclick=()=>{
    SCHEME_DRAFT.nombre = (document.getElementById('schNombre').value || SCHEME_DRAFT.nombre).trim() || 'Esquema sin nombre';
    if(!SCHEME_DRAFT.paquetes.length){ alert('Crea al menos un paquete de ítems antes de guardar el esquema.'); return; }
    STATE.schemes.push(SCHEME_DRAFT); persist(true); NAV={view:'admin-schemes'}; render();
  };

  /* ---- resultados ---- */
  document.querySelectorAll('[data-results-tab]').forEach(el=>{ el.onclick=()=>{ RESULTS_TAB=el.dataset.resultsTab; RESULTS_NAV={}; RESULTS_QUERY=''; COMPARE_SELECTED=null; render(); }; });
  document.querySelectorAll('[data-drill-scheme]').forEach(el=>{ el.onclick=()=>{ RESULTS_NAV={schemeId:el.dataset.drillScheme}; render(); }; });
  document.querySelectorAll('[data-drill-scheme-reset]').forEach(el=>{ el.onclick=()=>{ RESULTS_NAV={}; render(); }; });
  document.querySelectorAll('[data-drill-modulo]').forEach(el=>{ el.onclick=()=>{ RESULTS_NAV.moduloId=el.dataset.drillModulo; render(); }; });
  document.querySelectorAll('[data-drill-modulo-reset]').forEach(el=>{ el.onclick=()=>{ delete RESULTS_NAV.moduloId; render(); }; });
  document.querySelectorAll('[data-drill-persona]').forEach(el=>{ el.onclick=()=>{ RESULTS_NAV={userId:el.dataset.drillPersona}; render(); }; });
  document.querySelectorAll('[data-drill-persona-reset]').forEach(el=>{ el.onclick=()=>{ RESULTS_NAV={}; render(); }; });
  document.querySelectorAll('[data-drill-cross-modulo]').forEach(el=>{ el.onclick=()=>{ RESULTS_NAV={crossModuloId:el.dataset.drillCrossModulo}; render(); }; });
  document.querySelectorAll('[data-drill-cross-reset]').forEach(el=>{ el.onclick=()=>{ RESULTS_NAV={}; render(); }; });

  const resultsSearch = document.getElementById('resultsSearch');
  if(resultsSearch) resultsSearch.oninput = ()=>{ RESULTS_QUERY = resultsSearch.value; render(); };
  document.querySelectorAll('[data-compare-sub]').forEach(el=>{ el.onclick=()=>{ COMPARE_SELECTED = (COMPARE_SELECTED===el.dataset.compareSub)?null:el.dataset.compareSub; render(); }; });
  const closeCompareDetail = document.getElementById('closeCompareDetail');
  if(closeCompareDetail) closeCompareDetail.onclick = ()=>{ COMPARE_SELECTED=null; render(); };
  const viewAuditBtn = document.getElementById('viewAuditBtn');
  if(viewAuditBtn) viewAuditBtn.onclick = ()=>{ MODAL={open:true, kind:'audit-log', payload:{schemeId:RESULTS_NAV.schemeId}}; render(); };
  const certBtn = document.getElementById('certBtn');
  if(certBtn) certBtn.onclick = ()=>generateCertificate(RESULTS_NAV.schemeId);
  const execReportBtn = document.getElementById('execReportBtn');
  if(execReportBtn) execReportBtn.onclick = ()=>generateExecutiveReport();

  /* ---- solicitudes de reapertura ---- */
  document.querySelectorAll('[data-approve-req]').forEach(el=>{ el.onclick=()=>approveReopenRequest(el.dataset.approveReq, el.dataset.alcance); });
  document.querySelectorAll('[data-reject-req]').forEach(el=>{
    el.onclick=()=>{ const req=STATE.reopenRequests.find(r=>r.id===el.dataset.rejectReq); if(req){ req.estado='rechazado'; req.fechaResolucion=new Date().toLocaleString('es-EC'); persist(true); render(); } };
  });

  /* ---- modal genérico ---- */
  const modalOverlay=document.getElementById('modalOverlay');
  if(modalOverlay){
    modalOverlay.onclick=(e)=>{ if(e.target===modalOverlay) closeModal(); };
    const mc=document.getElementById('modalClose'); if(mc) mc.onclick=closeModal;
    const mcancel=document.getElementById('modalCancel'); if(mcancel) mcancel.onclick=closeModal;

    const nuSave=document.getElementById('nuSave');
    if(nuSave) nuSave.onclick=()=>{
      const nombre=document.getElementById('nuNombre').value.trim(), apellido=document.getElementById('nuApellido').value.trim();
      const cargo=document.getElementById('nuCargo').value.trim(), correo=document.getElementById('nuCorreo').value.trim();
      const role=document.getElementById('nuRole').value, pass=document.getElementById('nuPass').value;
      const err=document.getElementById('nuError');
      if(!nombre||!apellido||!correo){ err.textContent='Completa nombre, apellido y correo.'; err.classList.remove('hidden'); return; }
      if(STATE.users.some(u=>u.correo.toLowerCase()===correo.toLowerCase())){ err.textContent='Ya existe un usuario con ese correo.'; err.classList.remove('hidden'); return; }
      STATE.users.push({id:uid('u'), nombre, apellido, cargo, correo, password:pass||'Multicines2026', role, mustChange:true});
      persist(true); closeModal();
    };
    const euSave=document.getElementById('euSave');
    if(euSave) euSave.onclick=()=>{
      const u=MODAL.payload; const correo=document.getElementById('euCorreo').value.trim(); const err=document.getElementById('euError');
      if(STATE.users.some(x=>x.id!==u.id && x.correo.toLowerCase()===correo.toLowerCase())){ err.textContent='Ya existe otro usuario con ese correo.'; err.classList.remove('hidden'); return; }
      u.nombre=document.getElementById('euNombre').value.trim(); u.apellido=document.getElementById('euApellido').value.trim();
      u.cargo=document.getElementById('euCargo').value.trim(); u.correo=correo;
      if(u.id!=='u-admin') u.role=document.getElementById('euRole').value;
      persist(true); closeModal();
    };
    const eiSave=document.getElementById('eiSave'); if(eiSave) eiSave.onclick=()=>{ MODAL.payload.nombre=document.getElementById('eiNombre').value; persist(true); closeModal(); };
    const aiSave=document.getElementById('aiSave');
    if(aiSave) aiSave.onclick=()=>{ const nombre=document.getElementById('aiNombre').value.trim(); if(!nombre) return;
      STATE.catalog.forEach(m=>m.submodulos.forEach(s=>{ if(s.id===MODAL.payload.subId) s.items.push({id:uid('it'), nombre}); })); persist(true); buildItemIndex(); closeModal(); };
    const asSave=document.getElementById('asSave');
    if(asSave) asSave.onclick=()=>{ const nombre=document.getElementById('asNombre').value.trim(); if(!nombre) return;
      STATE.catalog.forEach(m=>{ if(m.id===MODAL.payload.moduloId) m.submodulos.push({id:uid('sub'), nombre, items:[]}); }); persist(true); buildItemIndex(); closeModal(); };
    const nmSave=document.getElementById('nmSave');
    if(nmSave) nmSave.onclick=()=>{ const nombre=document.getElementById('nmNombre').value.trim(); if(!nombre) return; const version=document.getElementById('nmVersion').value.trim();
      STATE.catalog.push({id:uid('m'), nombre, version, conjunto:'Vista', submodulos:[]}); persist(true); buildItemIndex(); closeModal(); };
    const pqSave=document.getElementById('pqSave');
    if(pqSave) pqSave.onclick=()=>{
      const nombre=document.getElementById('pqNombre').value.trim(); if(!nombre){ toast('Ponle un nombre al paquete'); return; }
      const userIds=Array.from(document.getElementById('pqUsers').selectedOptions).map(o=>o.value);
      const p=MODAL.payload;
      if(p.editId){ const pq=SCHEME_DRAFT.paquetes.find(x=>x.id===p.editId); pq.nombre=nombre; pq.userIds=userIds; }
      else{ SCHEME_DRAFT.paquetes.push({id:uid('pq'), nombre, userIds, itemIds:[...STAGING_SELECTED]}); STAGING_SELECTED=new Set(); }
      closeModal();
    };
    const reqSave = document.getElementById('reqSave');
    if(reqSave) reqSave.onclick = ()=>{
      const mensaje = document.getElementById('reqMensaje').value.trim();
      STATE.reopenRequests.push({id:uid('req'), schemeId:MODAL.payload.schemeId, userId:SESSION.userId, mensaje, estado:'pendiente', alcance:null, fechaSolicitud:new Date().toLocaleString('es-EC'), fechaResolucion:null});
      persist(true); closeModal(); toast('Solicitud enviada al administrador');
    };
  }
}

/* =========================== USER SHELL =========================== */

const USER_TABS = [
  {id:'user-schemes', icon:'◈', label:'Mis certificaciones'},
  {id:'user-results', icon:'▲', label:'Mis resultados'},
];

function renderUserShell(){
  let body='';
  if(NAV.view==='user-schemes') body = renderUserSchemeList();
  else if(NAV.view==='user-modules') body = renderUserModuleList();
  else if(NAV.view==='user-cert') body = renderUserCert();
  else if(NAV.view==='user-consolidado') body = renderUserConsolidado();
  else if(NAV.view==='user-results') body = renderUserResults();
  else body = renderUserSchemeList();

  const activeTab = NAV.view==='user-results' ? 'user-results' : 'user-schemes';
  const showCertBar = (NAV.view==='user-cert' || NAV.view==='user-modules') && NAV.schemeId;
  let certBarHtml = '';
  if(showCertBar){
    const sch = findScheme(NAV.schemeId);
    const ids = itemIdsForUser(sch, SESSION.userId);
    const p = progressOfItemIds(sch, ids);
    const subm = STATE.submissions[sch.id+'::'+SESSION.userId];
    const reabiertos = subm && subm.reabiertos ? subm.reabiertos : [];
    const locked = isLocked(sch.id, SESSION.userId) && reabiertos.length===0;
    certBarHtml = `
    <div class="cert-topbar">
      <div class="cert-progress-row">
        <span class="cert-progress-label">${sch.nombre}</span>
        <div class="cert-progress-track"><div class="progress-track"><div class="progress-fill ${p.pct===100?'pf-teal':''}" style="width:${p.pct}%"></div></div></div>
        <span class="cert-progress-pct">${p.pct}%</span>
        ${reabiertos.length ? `<span class="tag tag-naranja">${reabiertos.length} reabierto${reabiertos.length!==1?'s':''}</span><button class="btn btn-outline btn-sm" id="saveProgressBtn">Guardar</button><button class="btn btn-primary btn-sm" id="goConsolidadoBtn">Ver consolidado</button>` : locked ? '<span class="tag tag-teal">Enviado ✓</span>' : `<button class="btn btn-outline btn-sm" id="saveProgressBtn">Guardar</button>${p.pct===100?'<button class="btn btn-primary btn-sm" id="goConsolidadoBtn">Ver consolidado</button>':''}`}
      </div>
    </div>`;
  }
  return `
  ${topbar('')}
  <div style="background:var(--card); border-bottom:1px solid var(--border); padding:0 32px;">
    <div style="display:flex; gap:4px; max-width:1280px;">
      ${USER_TABS.map(t=>`<button class="filter-tab" style="border:none; border-radius:0; border-bottom:2.5px solid ${activeTab===t.id?'var(--cian)':'transparent'}; background:none; color:${activeTab===t.id?'var(--navy)':'var(--grayLight)'}; padding:14px 6px; margin-right:22px;" data-user-tab="${t.id}">${t.icon} ${t.label}</button>`).join('')}
    </div>
  </div>
  ${certBarHtml}
  <div class="content">${body}</div>
  ${MODAL.open ? renderModal() : ''}`;
}

function renderUserSchemeList(){
  const schemes = schemesForUser(SESSION.userId);
  if(!schemes.length){
    return `<div class="page-head"><h1 class="page-title">Mis certificaciones</h1><p class="page-sub">Todavía no tienes nada asignado.</p></div>
    <div class="panel"><div class="empty-state"><div class="es-icon">◈</div><div class="es-title">Por ahora no tienes certificaciones pendientes</div>En cuanto el administrador te asigne un paquete, lo vas a ver aquí.</div></div>`;
  }
  const cards = schemes.map(sch=>{
    const ids = itemIdsForUser(sch, SESSION.userId);
    const p = progressOfItemIds(sch, ids);
    const locked = isLocked(sch.id, SESSION.userId);
    const sub = STATE.submissions[sch.id+'::'+SESSION.userId];
    const reabiertos = sub && sub.reabiertos ? sub.reabiertos : [];
    const pendingReq = STATE.reopenRequests.find(r=>r.schemeId===sch.id && r.userId===SESSION.userId && r.estado==='pendiente');
    const ringColor = reabiertos.length ? 'var(--naranjaFuerte)' : (locked ? 'var(--teal)' : (p.pct===100?'var(--naranjaFuerte)':'var(--cian)'));
    let ctaLabel = 'Continuar certificando', ctaClass = 'btn-primary';
    if(reabiertos.length){ ctaLabel='Corregir ítems reabiertos'; ctaClass='btn-warn'; }
    else if(locked){ ctaLabel='Ver histórico'; ctaClass='btn-outline'; }
    else if(p.pct===100){ ctaLabel='Revisar y enviar'; }
    return `
    <div class="campaign-card">
      <div class="campaign-card-top">
        <div class="campaign-ring-wrap">${circularProgress(p.pct,64,ringColor)}<div class="campaign-ring-pct">${p.pct}%</div></div>
        <div style="flex:1;">
          <div class="campaign-title">${sch.nombre}</div>
          <div class="campaign-meta">${sch.ambiente==='Producción'?'🚀':'🧪'} ${sch.ambiente} · ${ids.length} ítems</div>
        </div>
        <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">${semaphoreHtml(readiness(p.pct,p.fail).light, {title:readiness(p.pct,p.fail).label})}<span class="tag ${sch.ambiente==='Producción'?'tag-magenta':'tag-cian'}">${sch.ambiente}</span></div>
      </div>
      <div class="campaign-stats">
        <span class="tag tag-teal">${p.ok} bien</span><span class="tag tag-rojo">${p.fail} con fallas</span>
        ${reabiertos.length?`<span class="tag tag-naranja">${reabiertos.length} reabierto${reabiertos.length!==1?'s':''}</span>`:locked?`<span class="tag tag-neutral">Enviado ${sub.fecha.split(',')[0]}</span>`:''}
        ${!reabiertos.length && locked && pendingReq?`<span class="tag tag-naranja">Reapertura solicitada</span>`:''}
      </div>
      <button class="btn ${ctaClass} campaign-cta" data-open-scheme="${sch.id}">${ctaLabel}</button>
    </div>`;
  }).join('');
  return `<div class="page-head"><h1 class="page-title">Mis certificaciones</h1><p class="page-sub">Elige en qué certificación quieres trabajar.</p></div>
    <div class="cards-grid" style="grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));">${cards}</div>`;
}

function renderUserModuleList(){
  const sch = findScheme(NAV.schemeId);
  const grouped = groupedForUser(sch, SESSION.userId);
  const locked = isLocked(sch.id, SESSION.userId);
  const sub = STATE.submissions[sch.id+'::'+SESSION.userId];
  const reabiertos = sub && sub.reabiertos ? sub.reabiertos : [];
  const blocks = grouped.map(g=>{
    const allIds = g.subs.flatMap(x=>x.items.map(it=>it.id));
    const p = progressOfItemIds(sch, allIds);
    const subRows = g.subs.map(x=>{
      const ids = x.items.map(it=>it.id); const sp = progressOfItemIds(sch, ids);
      return `<div class="sub-mini-row"><span class="sub-mini-name">${x.sub.nombre}</span><div class="sub-mini-track"><div class="progress-track"><div class="progress-fill ${sp.pct===100?'pf-teal':''}" style="width:${sp.pct}%"></div></div></div><span class="sub-mini-pct">${sp.pct}%</span></div>`;
    }).join('');
    return `
    <div class="module-block" data-open-modulo="${g.modulo.id}" style="cursor:pointer;">
      <div class="module-block-top">
        <div class="mod-icon bg-${accentFor(g.modulo.id)}" style="margin-bottom:0;">${moduloIcon(g.modulo.nombre)}</div>
        <div style="flex:1;"><div class="module-block-title">${g.modulo.nombre}</div><div class="module-block-meta">${g.subs.length} secciones · ${allIds.length} ítems · ${p.pct}% certificado</div></div>
        <span class="tag ${p.pct===100?'tag-teal':'tag-neutral'}">${p.done}/${p.total}</span>
      </div>
      ${subRows}
    </div>`;
  }).join('');
  return `
    <div class="breadcrumbs"><a data-nav="user-schemes">Mis certificaciones</a><span class="sep">/</span><span class="current">${sch.nombre}</span></div>
    <div class="page-head"><h1 class="page-title">${sch.nombre}</h1><p class="page-sub">${reabiertos.length?`El administrador reabrió ${reabiertos.length} ítem(s) para que los corrijas.`:locked?'Esta certificación ya fue enviada — puedes revisarla, pero no editarla.':'Estos son los módulos y secciones que te tocan. Haz clic en uno para empezar a certificar.'}</p></div>
    ${blocks}`;
}

function itemStateIcon(c){
  if(c.estado==='ok') return `<div class="item-state-icon" style="background:var(--teal); color:#fff;">✓</div>`;
  if(c.estado==='fail') return `<div class="item-state-icon" style="background:var(--rojo); color:#fff;">✕</div>`;
  return `<div class="item-state-icon" style="background:var(--border); color:var(--grayLight);">○</div>`;
}

function itemCardHtml(schemeId, item, idx, editable, wasReabierto){
  const c = certFor(schemeId, item.id);
  const needsComment = c.estado==='fail' || c.cambio==='si';
  if(!editable){
    const estTxt = c.estado==='ok'?'<span class="ro-item-state tag-teal">✓ Funciona correctamente</span>':c.estado==='fail'?'<span class="ro-item-state tag-rojo">✕ No funciona</span>':'<span class="ro-item-state tag-neutral">Sin certificar</span>';
    const cambTxt = c.cambio==='si'?'<span class="ro-item-state tag-naranja">Con cambios</span>':'<span class="ro-item-state tag-neutral">Sin cambios</span>';
    return `<div class="item-card" data-item-id="${item.id}">
      <div class="item-card-top"><span class="item-num">${idx}</span><div class="item-name">${item.nombre}</div></div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">${estTxt}${cambTxt}</div>
      ${c.comentario?`<div class="item-comment-box ${c.estado==='fail'?'tone-rojo':''}" style="margin-top:12px; grid-template-columns:1fr;"><div style="font-size:13px; color:var(--gray);">${c.comentario}</div></div>`:''}
    </div>`;
  }
  return `
    <div class="item-card ${wasReabierto?'reabierto':''}" data-item-id="${item.id}">
      ${wasReabierto?`<div class="locked-ribbon" style="border-color:var(--naranjaFuerte); color:var(--naranjaFuerte);">🔓 Reabierto por el administrador — vuelve a certificarlo</div>`:''}
      <div class="item-card-top">
        <span class="item-num">${idx}</span>
        <div class="item-name">${item.nombre}</div>
        ${itemStateIcon(c)}
      </div>
      <div class="eval-block">
        <div class="eval-block-label">¿Funciona correctamente en este ambiente?</div>
        <div class="eval-choice-row">
          <button class="eval-choice ${c.estado==='ok'?'on-teal':''}" data-set-estado="${item.id}" data-val="ok">✓ Sí, funciona</button>
          <button class="eval-choice ${c.estado==='fail'?'on-rojo':''}" data-set-estado="${item.id}" data-val="fail">✕ No funciona</button>
        </div>
      </div>
      <div class="eval-block">
        <div class="eval-block-label">¿Notaste cambios frente a la versión anterior?</div>
        <div class="eval-choice-row">
          <button class="eval-choice ${c.cambio==='no'?'on-neutral':''}" data-set-cambio="${item.id}" data-val="no">No, sigue igual</button>
          <button class="eval-choice ${c.cambio==='si'?'on-naranja':''}" data-set-cambio="${item.id}" data-val="si">Sí, cambió</button>
        </div>
      </div>
      ${needsComment ? `
      <div class="item-comment-box ${c.estado==='fail'?'tone-rojo':''}">
        <div>
          <label style="font-size:11px; font-weight:700; color:var(--gray); display:block; margin-bottom:6px;">Cuéntanos qué pasó <span class="req-star">*</span></label>
          <textarea placeholder="Describe qué no funcionó, o qué es distinto respecto a la versión anterior..." data-comment="${item.id}">${c.comentario||''}</textarea>
        </div>
        <label class="file-btn ${c.evidencia?'has-file':''}">
          <input type="file" accept="image/*" data-evidencia="${item.id}">
          <span>${c.evidencia ? '✓ '+c.evidencia : '📎 Adjuntar captura'}</span>
        </label>
      </div>` : ''}
    </div>`;
}

function renderUserCert(){
  const sch = findScheme(NAV.schemeId);
  const modulo = findModulo(NAV.moduloId);
  const sub = STATE.submissions[sch.id+'::'+SESSION.userId];
  const reabiertos = sub && sub.reabiertos ? sub.reabiertos : [];
  const fullyLocked = isLocked(sch.id, SESSION.userId) && !(sub && sub.reabiertoTotal) && reabiertos.length===0;
  const grouped = groupedForUser(sch, SESSION.userId).find(g=>g.modulo.id===modulo.id);
  let counter=0;
  const blocks = (grouped?grouped.subs:[]).map(x=>`
    <div class="sub-block">
      <div class="sub-block-title">${x.sub.nombre} <span class="sub-block-count">${x.items.length} ítems</span></div>
      ${x.items.map(it=>{ counter++; const editable = isItemEditable(sch.id, SESSION.userId, it.id); return itemCardHtml(sch.id, it, counter, editable, reabiertos.includes(it.id)); }).join('')}
    </div>`).join('');
  return `
    <div class="breadcrumbs"><a data-nav="user-schemes">Mis certificaciones</a><span class="sep">/</span><a data-open-scheme="${sch.id}">${sch.nombre}</a><span class="sep">/</span><span class="current">${modulo.nombre}</span></div>
    ${fullyLocked?`<div class="readonly-banner"><div class="readonly-banner-icon">✓</div><div><b style="color:var(--navy);">Certificación enviada.</b> <span style="color:var(--gray);">Ya no se puede modificar — esto es solo para consulta.</span></div></div>`:''}
    ${reabiertos.length?`<div class="readonly-banner" style="background:var(--naranja-bg); border-color:var(--naranjaFuerte);"><div class="readonly-banner-icon" style="background:var(--naranjaFuerte);">🔓</div><div><b style="color:var(--navy);">El administrador reabrió ${reabiertos.length} ítem${reabiertos.length!==1?'s':''}.</b> <span style="color:var(--gray);">Corrígelos y confirma los cambios desde el consolidado.</span></div></div>`:''}
    <div class="page-head"><h1 class="page-title">${modulo.nombre}</h1><p class="page-sub">${fullyLocked?'Así quedó registrada esta sección.':'Revisa cada caso: primero si funciona, después si notaste cambios. Si algo falló o cambió, cuéntanos qué pasó.'}</p></div>
    ${blocks}`;
}

function renderUserConsolidado(){
  const sch = findScheme(NAV.schemeId);
  const ids = itemIdsForUser(sch, SESSION.userId);
  const p = progressOfItemIds(sch, ids);
  const cambios = ids.filter(id=>(STATE.certs[sch.id]?.[id]||{}).cambio==='si').length;
  const sub = STATE.submissions[sch.id+'::'+SESSION.userId];
  const reabiertos = sub && sub.reabiertos ? sub.reabiertos : [];
  const reabiertosResueltos = reabiertos.length && reabiertos.every(id=>{ const c=STATE.certs[sch.id]?.[id]; return c && c.estado; });
  const rows = ids.map(id=>{
    const idx=ITEM_INDEX[id]; const c=STATE.certs[sch.id]?.[id]||{};
    const estTag = c.estado==='ok'?'<span class="tag tag-teal">Funciona</span>':c.estado==='fail'?'<span class="tag tag-rojo">No funciona</span>':'<span class="tag tag-neutral">Pendiente</span>';
    const cambTag = c.cambio==='si'?'<span class="tag tag-naranja">Con cambios</span>':'';
    const reabiertoTag = reabiertos.includes(id)?'<span class="tag tag-naranja">🔓 Reabierto</span>':'';
    return `<tr class="row-hover" data-jump-item="${id}" style="cursor:pointer;"><td>${idx.modulo.nombre} · ${idx.item.nombre}</td><td>${estTag} ${reabiertoTag}</td><td>${cambTag}</td><td style="max-width:260px; color:var(--grayLight); font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${c.comentario||''}</td></tr>`;
  }).join('');

  let actionArea;
  if(sub && sub.enviado && reabiertos.length){
    actionArea = `<button class="btn btn-warn" id="confirmReopenBtn" ${reabiertosResueltos?'':'disabled'}>Confirmar cambios y volver a enviar</button>`;
  } else if(sub && sub.enviado){
    const pendingReq = STATE.reopenRequests.find(r=>r.schemeId===sch.id && r.userId===SESSION.userId && r.estado==='pendiente');
    actionArea = `<span class="tag tag-teal" style="padding:10px 16px; font-size:13px;">✓ Enviado el ${sub.fecha}</span><button class="btn btn-outline" id="printBtn">🖨️ Imprimir mi constancia</button>${pendingReq?'<span class="tag tag-naranja" style="padding:10px 16px; font-size:13px;">Solicitud de reapertura enviada, esperando respuesta</span>':'<button class="btn btn-outline" id="requestReopenBtn">Solicitar reapertura</button>'}`;
  } else {
    actionArea = `<button class="btn btn-warn" id="submitBtn" ${p.done<p.total?'disabled':''}>🔒 Guardar y enviar</button>`;
  }

  return `
    <div class="breadcrumbs"><a data-nav="user-schemes">Mis certificaciones</a><span class="sep">/</span><span class="current">Consolidado — ${sch.nombre}</span></div>
    <div class="page-head"><h1 class="page-title">${sub&&sub.enviado?(reabiertos.length?'Certificación reabierta':'Certificación enviada'):'Revisa tu certificación'}</h1><p class="page-sub">${sub&&sub.enviado?(reabiertos.length?`Corrige los ${reabiertos.length} ítem(s) reabiertos y confirma para volver a enviar.`:`Enviada el ${sub.fecha}. Ya no se puede modificar.`):'Este es el resultado completo antes de enviarlo. Haz clic en cualquier fila para volver a ese ítem y corregirlo.'}</p></div>
    <div class="consol-summary">
      <div class="consol-chip"><div class="n">${p.total}</div><div class="l">Ítems en total</div></div>
      <div class="consol-chip"><div class="n" style="color:var(--teal)">${p.ok}</div><div class="l">Funcionan bien</div></div>
      <div class="consol-chip"><div class="n" style="color:var(--rojo)">${p.fail}</div><div class="l">No funcionan</div></div>
      <div class="consol-chip"><div class="n" style="color:var(--naranjaFuerte)">${cambios}</div><div class="l">Tuvieron cambios</div></div>
    </div>
    <div class="panel" style="padding:0; margin-bottom:20px;"><table><thead><tr><th>Ítem</th><th>Estado</th><th>Cambios</th><th>Comentario</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      ${actionArea}
      <button class="btn btn-outline" id="downloadBtn">Descargar resultado</button>
    </div>
    ${p.done<p.total && !(sub&&sub.enviado) ? `<p class="hint" style="margin-top:10px;">Faltan ${p.total-p.done} ítems por certificar antes de poder enviar.</p>` : ''}`;
}
