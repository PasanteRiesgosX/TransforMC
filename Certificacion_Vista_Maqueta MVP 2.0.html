let MY_RESULTS_FILTER = 'todos';
function renderUserResults(){
  const u = findUser(SESSION.userId);
  const schemes = schemesForUser(u.id);
  let allIds=[]; let ok=0, fail=0;
  const perScheme = schemes.map(sch=>{ const ids=itemIdsForUser(sch,u.id); const p=progressOfItemIds(sch,ids); allIds=allIds.concat(ids); ok+=p.ok; fail+=p.fail; return {sch, ids, p}; });
  const pct = allIds.length?Math.round((ok+fail)/allIds.length*100):0;
  const tabs = [{id:'todos',label:'Todos'},{id:'fallas',label:'Con falla'},{id:'ok',label:'Funcionales'},{id:'pendientes',label:'Pendientes'}];
  let rows = [];
  perScheme.forEach(({sch, ids})=>{
    ids.forEach(id=>{ const idx=ITEM_INDEX[id]; const c=(STATE.certs[sch.id]||{})[id]||{}; rows.push({sch, idx, c}); });
  });
  if(MY_RESULTS_FILTER==='fallas') rows = rows.filter(r=>r.c.estado==='fail');
  else if(MY_RESULTS_FILTER==='ok') rows = rows.filter(r=>r.c.estado==='ok');
  else if(MY_RESULTS_FILTER==='pendientes') rows = rows.filter(r=>!r.c.estado);
  const tableRows = rows.map(r=>{
    const estTag = r.c.estado==='ok'?'<span class="tag tag-teal">Funciona</span>':r.c.estado==='fail'?'<span class="tag tag-rojo">No funciona</span>':'<span class="tag tag-neutral">Pendiente</span>';
    return `<tr><td>${r.sch.nombre}</td><td>${r.idx.modulo.nombre} · ${r.idx.item.nombre}</td><td>${estTag}</td><td style="color:var(--grayLight); font-size:12.5px;">${r.c.comentario||''}</td></tr>`;
  }).join('') || `<tr><td colspan="4" style="text-align:center; color:var(--grayLight); padding:24px;">Nada que mostrar con este filtro.</td></tr>`;
  return `
    <div class="page-head"><h1 class="page-title">Mis resultados</h1><p class="page-sub">Tu progreso en todas las certificaciones que tienes asignadas.</p></div>
    <div class="grid-4" style="margin-bottom:22px;">
      <div class="stat-card"><p class="stat-num">${pct}%</p><p class="stat-label">Avance general</p></div>
      <div class="stat-card"><p class="stat-num" style="color:var(--teal)">${ok}</p><p class="stat-label">Funcionan bien</p></div>
      <div class="stat-card"><p class="stat-num" style="color:var(--rojo)">${fail}</p><p class="stat-label">Con fallas</p></div>
      <div class="stat-card"><p class="stat-num">${allIds.length-ok-fail}</p><p class="stat-label">Pendientes</p></div>
    </div>
    <p style="font-weight:700; font-size:13px; color:var(--navy); margin:0 0 12px;">Gestionar mis certificaciones</p>
    ${perScheme.map(({sch, ids, p:sp})=>{
      const r = readiness(sp.pct, sp.fail);
      const sub = STATE.submissions[sch.id+'::'+u.id];
      const reabiertos = sub && sub.reabiertos ? sub.reabiertos : [];
      const pendingReq = STATE.reopenRequests.find(x=>x.schemeId===sch.id && x.userId===u.id && x.estado==='pendiente');
      let reopenAction = '';
      if(reabiertos.length){ reopenAction = `<span class="tag tag-naranja" style="padding:9px 14px;">${reabiertos.length} ítem(s) reabierto(s) — corrígelos</span>`; }
      else if(sub && sub.enviado && pendingReq){ reopenAction = `<span class="tag tag-neutral" style="padding:9px 14px;">Reapertura solicitada, esperando respuesta</span>`; }
      else if(sub && sub.enviado){ reopenAction = `<button class="btn btn-outline btn-sm" data-request-reopen-mgmt="${sch.id}">🔓 Solicitar reapertura</button>`; }
      return `<div class="mgmt-card">
        <div class="mgmt-card-top">
          <div><div class="mgmt-title">${sch.nombre}</div><div class="mgmt-meta">${sch.ambiente==='Producción'?'🚀':'🧪'} ${sch.ambiente} · ${ids.length} ítems · ${sp.pct}% avance</div></div>
          <div style="display:flex; align-items:center; gap:10px;">${semaphoreHtml(r.light,{title:r.label})}<span class="tag ${r.cls}">${r.label}</span></div>
        </div>
        <div class="mgmt-actions">
          <button class="btn btn-outline btn-sm" data-print-cert="${sch.id}">🖨️ Imprimir mi constancia</button>
          <button class="btn btn-outline btn-sm" data-download-listado="${sch.id}">⬇️ Descargar listado (CSV)</button>
          <button class="btn btn-ghost btn-sm" data-view-scheme-mgmt="${sch.id}">👁️ Ver certificación</button>
          ${reopenAction}
        </div>
      </div>`;
    }).join('') || `<div class="panel"><div class="empty-state"><div class="es-title">Todavía no tienes certificaciones asignadas</div></div></div>`}
    <p style="font-weight:700; font-size:13px; color:var(--navy); margin:26px 0 12px;">Detalle ítem por ítem</p>
    <div class="filter-tabs">${tabs.map(t=>`<button class="filter-tab ${MY_RESULTS_FILTER===t.id?'active':''}" data-my-results-filter="${t.id}">${t.label}</button>`).join('')}</div>
    <div class="panel" style="padding:0;"><table><thead><tr><th>Esquema</th><th>Ítem</th><th>Estado</th><th>Comentario</th></tr></thead><tbody>${tableRows}</tbody></table></div>`;
}

function openPrintWindow(title, bodyHtml, styleExtra){
  const w = window.open('', '_blank');
  if(!w){ toast('El navegador bloqueó la ventana emergente — habilita ventanas emergentes para ver el documento'); return; }
  w.document.write(`<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>${title}</title><style>${styleExtra}</style></head><body>${bodyHtml}<script>window.onload=function(){ setTimeout(function(){ window.print(); }, 450); };<\/script></body></html>`);
  w.document.close();
  toast('Se abrió en una pestaña nueva — puedes guardarlo como PDF desde el diálogo de impresión');
}

function generateExecutiveReport(){
  const genDate = new Date().toLocaleString('es-EC');
  const flat = allFlatEntries();
  const allOk = flat.filter(f=>f.cert.estado==='ok').length;
  const allFail = flat.filter(f=>f.cert.estado==='fail').length;
  const allDone = allOk+allFail;
  const totalPct = flat.length?Math.round(allDone/flat.length*100):0;

  const schemeRows = STATE.schemes.map(sch=>{
    const ids = allItemIdsInScheme(sch); const p = progressOfItemIds(sch, ids); const r = readiness(p.pct, p.fail);

  const failList = flat.filter(f=>f.cert.estado==='fail');

  const body = `

      <div class="rstat"><b>${allFail}</b><span>Ítems con fallas</span></div>

  .semaphore-light.light-green.active{ background:#00E0A4; box-shadow:0 0 7px #00E0A4; }
  .cert-stats{ display:flex; gap:20px; margin:0 0 26px; }
  .cert-stats .rstat{ flex:1; border:1px solid #E7EAF2; border-radius:8px; padding:14px; text-align:center; }
  .cert-stats .rstat b{ display:block; font-size:21px; }
  .cert-stats .rstat span{ font-size:10.5px; color:#6E747A; }
  h2{ font-size:14px; margin:24px 0 10px; }
  table{ width:100%; border-collapse:collapse; font-size:11.5px; }
  th{ text-align:left; background:#F4F6FA; padding:7px 10px; border-bottom:2px solid #00AEEF; font-size:10px; text-transform:uppercase; letter-spacing:0.03em; }
  td{ padding:7px 10px; border-bottom:1px solid #eee; }
  .cert-sign{ display:flex; justify-content:space-between; align-items:flex-end; margin-top:38px; padding-top:16px; border-top:1px solid #E7EAF2; gap:20px; }
  .cert-sign .sb{ }
  .cert-sign .sb span{ display:block; font-size:9.5px; color:#8A90A4; text-transform:uppercase; margin-bottom:3px; }
  .cert-sign .sb b{ font-size:13px; display:block; border-top:1px solid #1E2233; padding-top:6px; margin-top:22px; }
  .cert-note{ font-size:9.5px; color:#9AA0AC; line-height:1.5; margin-top:26px; }
  @media print{ body{ padding:20px 30px; } }
`;

function certInfoBar(sch, r, folio, fecha){
  return `<div class="cert-infobar">
    <div class="ib"><span>Folio</span><b>${folio}</b></div>
    <div class="ib"><span>Ambiente</span><b>${sch.ambiente}</b></div>
    <div class="ib"><span>Fecha de emisión</span><b>${fecha}</b></div>
    <div class="status-block">${semaphoreHtml(r.light)}<span class="cert-status-label" style="color:${r.light==='green'?'#00806E':r.light==='red'?'#E53935':'#B8860B'};">${r.label}</span></div>
  </div>`;
}

function generateCertificate(schemeId){
  const sch = findScheme(schemeId);
  if(!sch) return;
  const ids = allItemIdsInScheme(sch);
  const p = progressOfItemIds(sch, ids);
  const r = readiness(p.pct, p.fail);
  const respIds = new Set(); sch.paquetes.forEach(pq=>pq.userIds.forEach(u=>respIds.add(u)));
  const responsables = [...respIds].map(id=>findUser(id)).filter(Boolean).map(u=>u.nombre+' '+u.apellido).join(', ');
  const folio = 'VC5-'+sch.id.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(-6);
  const fecha = new Date().toLocaleDateString('es-EC', {day:'2-digit', month:'long', year:'numeric'});
  const admin = findUser(SESSION.userId);

  // desglose por módulo · sección
  const bySub = {};
  ids.forEach(id=>{ const idx=ITEM_INDEX[id]; const key=idx.modulo.id+'::'+idx.sub.id; if(!bySub[key]) bySub[key]={modulo:idx.modulo, sub:idx.sub, ids:[]}; bySub[key].ids.push(id); });
  const subRows = Object.values(bySub).map(g=>{
    const gp = progressOfItemIds(sch, g.ids); const gr = readiness(gp.pct, gp.fail);
    return `<tr><td>${g.modulo.nombre} · ${g.sub.nombre}</td><td>${g.ids.length}</td><td>${gp.pct}%</td><td>${gr.emoji} ${gr.label}</td></tr>`;
  }).join('');

  const fails = ids.map(id=>({id, idx:ITEM_INDEX[id], c:(STATE.certs[sch.id]||{})[id]})).filter(x=>x.c && x.c.estado==='fail');
  const failRows = fails.map(f=>`<tr><td>${f.idx.modulo.nombre} · ${f.idx.item.nombre}</td><td>${f.c.comentario||'—'}</td></tr>`).join('');

  const body = `
    <div class="cert-header"><img src="${LOGO_COLOR}" alt="Multicines"><div><p class="cert-kicker">Certificación Vista 5.0 · Multicines S.A.</p><h1>Constancia de Certificación Técnica</h1><p class="cert-sub">${sch.nombre}</p></div></div>
    ${certInfoBar(sch, r, folio, fecha)}
    <div class="cert-stats">
      <div class="rstat"><b>${p.pct}%</b><span>Avance</span></div>
      <div class="rstat"><b>${p.ok}</b><span>Funcionan bien</span></div>
      <div class="rstat"><b>${p.fail}</b><span>Con fallas</span></div>
      <div class="rstat"><b>${p.total-p.done}</b><span>Pendientes</span></div>
    </div>
    <h2>Desglose por módulo y sección</h2>
    <table><thead><tr><th>Módulo · Sección</th><th>Ítems</th><th>Avance</th><th>Estado</th></tr></thead><tbody>${subRows}</tbody></table>
    ${fails.length ? `<h2>Observaciones registradas</h2><table><thead><tr><th>Ítem</th><th>Comentario</th></tr></thead><tbody>${failRows}</tbody></table>` : ''}
    <div class="cert-sign">
      <div class="sb"><span>Responsables de certificación</span><b style="border:none; padding:0; margin:4px 0 0;">${responsables||'—'}</b></div>
      <div class="sb" style="text-align:right;"><span>Emitido por</span><b>${admin.nombre} ${admin.apellido}</b></div>
    </div>
    <p class="cert-note">Esta constancia resume el estado de certificación técnica del esquema indicado, dentro del proceso de actualización del sistema Vista. Documento generado automáticamente por la app de Certificación Vista 5.0 — Multicines S.A.</p>
  `;
  openPrintWindow('Constancia de Certificación — '+sch.nombre, body, CERT_STYLE);
}

function generateUserCertificate(schemeId, userId){
  const sch = findScheme(schemeId);
  const u = findUser(userId);
  if(!sch || !u) return;
  const ids = itemIdsForUser(sch, userId);
  const p = progressOfItemIds(sch, ids);
  const r = readiness(p.pct, p.fail);
  const folio = 'VC5-'+sch.id.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(-6)+'-'+u.id.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(-4);
  const sub = STATE.submissions[sch.id+'::'+userId];
  const fecha = sub && sub.fecha ? sub.fecha : new Date().toLocaleDateString('es-EC', {day:'2-digit', month:'long', year:'numeric'});

  const rows = ids.map(id=>{
    const idx=ITEM_INDEX[id]; const c=(STATE.certs[sch.id]||{})[id]||{};
    const estTxt = c.estado==='ok'?'Funciona':c.estado==='fail'?'No funciona':'Pendiente';
    return `<tr><td>${idx.modulo.nombre} · ${idx.sub.nombre}</td><td>${idx.item.nombre}</td><td>${estTxt}</td><td>${c.cambio==='si'?'Sí':'No'}</td><td style="max-width:200px;">${c.comentario||''}</td></tr>`;
  }).join('');

  const body = `
    <div class="cert-header"><img src="${LOGO_COLOR}" alt="Multicines"><div><p class="cert-kicker">Certificación Vista 5.0 · Multicines S.A.</p><h1>Constancia de Certificación Individual</h1><p class="cert-sub">${u.nombre} ${u.apellido} — ${sch.nombre}</p></div></div>
    ${certInfoBar(sch, r, folio, fecha)}
    <div class="cert-stats">
      <div class="rstat"><b>${p.pct}%</b><span>Avance</span></div>
      <div class="rstat"><b>${p.ok}</b><span>Funcionan bien</span></div>
      <div class="rstat"><b>${p.fail}</b><span>Con fallas</span></div>
      <div class="rstat"><b>${p.total-p.done}</b><span>Pendientes</span></div>
    </div>
    <h2>Detalle de lo certificado</h2>
    <table><thead><tr><th>Módulo · Sección</th><th>Ítem</th><th>Estado</th><th>Cambios</th><th>Comentario</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="cert-sign">
      <div class="sb"><span>Certificado por</span><b>${u.nombre} ${u.apellido}</b></div>
      <div class="sb" style="text-align:right;"><span>${sub&&sub.enviado?'Enviado el':'Estado al'}</span><b>${fecha}</b></div>
    </div>
    <p class="cert-note">Esta constancia resume lo certificado por ${u.nombre} ${u.apellido} dentro del esquema "${sch.nombre}", como parte del proceso de actualización del sistema Vista. Documento generado automáticamente por la app de Certificación Vista 5.0 — Multicines S.A.</p>
  `;
  openPrintWindow('Constancia de Certificación — '+u.nombre+' '+u.apellido, body, CERT_STYLE);
}

function csvEscape(s){ return '"'+String(s==null?'':s).replace(/"/g,'""')+'"'; }
function downloadResult(sch, userId){
  const u = findUser(userId);
  const ids = itemIdsForUser(sch, userId);
  let lines=[['Módulo','Sección','Ítem','Estado','Cambió vs. versión anterior','Comentario'].map(csvEscape).join(',')];
  ids.forEach(id=>{ const idx=ITEM_INDEX[id]; const c=STATE.certs[sch.id]?.[id]||{};
    lines.push([idx.modulo.nombre, idx.sub.nombre, idx.item.nombre, c.estado==='ok'?'Cumple':c.estado==='fail'?'No cumple':'Pendiente', c.cambio==='si'?'Sí':'No', c.comentario||''].map(csvEscape).join(',')); });
  const blob = new Blob(['\ufeff'+lines.join('\n')], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=`Certificacion_${sch.nombre.replace(/[^a-z0-9]+/gi,'_')}_${u.nombre}${u.apellido}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

function attachUserEvents(){
  document.getElementById('logoutBtn').onclick = logout;
  document.querySelectorAll('[data-user-tab]').forEach(el=>{ el.onclick=()=>{ NAV={view:el.dataset.userTab}; render(); }; });
  document.querySelectorAll('[data-nav]').forEach(el=>{ el.onclick=()=>{ NAV={view:el.dataset.nav, schemeId:NAV.schemeId}; render(); }; });
  document.querySelectorAll('[data-open-scheme]').forEach(el=>{ el.onclick=()=>{ NAV={view:'user-modules', schemeId:el.dataset.openScheme}; render(); }; });
  document.querySelectorAll('[data-open-modulo]').forEach(el=>{ el.onclick=()=>{ NAV={view:'user-cert', schemeId:NAV.schemeId, moduloId:el.dataset.openModulo}; render(); }; });
  document.querySelectorAll('[data-my-results-filter]').forEach(el=>{ el.onclick=()=>{ MY_RESULTS_FILTER=el.dataset.myResultsFilter; render(); }; });
  document.querySelectorAll('[data-print-cert]').forEach(el=>{ el.onclick=()=>generateUserCertificate(el.dataset.printCert, SESSION.userId); });
  document.querySelectorAll('[data-download-listado]').forEach(el=>{ el.onclick=()=>downloadResult(findScheme(el.dataset.downloadListado), SESSION.userId); });
  document.querySelectorAll('[data-view-scheme-mgmt]').forEach(el=>{ el.onclick=()=>{ NAV={view:'user-modules', schemeId:el.dataset.viewSchemeMgmt}; render(); }; });
  document.querySelectorAll('[data-request-reopen-mgmt]').forEach(el=>{ el.onclick=()=>{ MODAL={open:true, kind:'request-reopen', payload:{schemeId:el.dataset.requestReopenMgmt}}; render(); }; });

  const saveProgressBtn=document.getElementById('saveProgressBtn'); if(saveProgressBtn) saveProgressBtn.onclick=()=>persist(true);
  const goConsolidadoBtn=document.getElementById('goConsolidadoBtn'); if(goConsolidadoBtn) goConsolidadoBtn.onclick=()=>{ NAV={view:'user-consolidado', schemeId:NAV.schemeId}; render(); };

  document.querySelectorAll('[data-set-estado]').forEach(el=>{ el.onclick=()=>{
    if(!isItemEditable(NAV.schemeId, SESSION.userId, el.dataset.setEstado)) return;
    const c=certFor(NAV.schemeId, el.dataset.setEstado); c.estado=(c.estado===el.dataset.val)?null:el.dataset.val;
    const idx=ITEM_INDEX[el.dataset.setEstado]; logAudit(NAV.schemeId, el.dataset.setEstado, idx?idx.item.nombre:'', 'estado', c.estado);
    persist(false); render();
  }; });
  document.querySelectorAll('[data-set-cambio]').forEach(el=>{ el.onclick=()=>{
    if(!isItemEditable(NAV.schemeId, SESSION.userId, el.dataset.setCambio)) return;
    const c=certFor(NAV.schemeId, el.dataset.setCambio); c.cambio=(c.cambio===el.dataset.val)?null:el.dataset.val;
    const idx=ITEM_INDEX[el.dataset.setCambio]; logAudit(NAV.schemeId, el.dataset.setCambio, idx?idx.item.nombre:'', 'cambio', c.cambio);
    persist(false); render();
  }; });
  document.querySelectorAll('[data-comment]').forEach(el=>{ el.oninput=()=>{ if(isItemEditable(NAV.schemeId, SESSION.userId, el.dataset.comment)) certFor(NAV.schemeId, el.dataset.comment).comentario=el.value; }; el.onblur=()=>persist(false); });
  document.querySelectorAll('[data-evidencia]').forEach(el=>{ el.onchange=()=>{
    if(!isItemEditable(NAV.schemeId, SESSION.userId, el.dataset.evidencia)) return;
    const f=el.files[0]; if(f){ certFor(NAV.schemeId, el.dataset.evidencia).evidencia=f.name; persist(false); render(); }
  }; });

  document.querySelectorAll('[data-jump-item]').forEach(el=>{
    el.onclick=()=>{
      const itemId=el.dataset.jumpItem; const idx=ITEM_INDEX[itemId];
      NAV={view:'user-cert', schemeId:NAV.schemeId, moduloId:idx.modulo.id}; render(); };
  });

  const submitBtn=document.getElementById('submitBtn'); if(submitBtn) submitBtn.onclick=()=>{ MODAL={open:true, kind:'confirm-submit'}; render(); };
  const confirmSubmitBtn=document.getElementById('confirmSubmitBtn');
  if(confirmSubmitBtn) confirmSubmitBtn.onclick=()=>{
    STATE.submissions[NAV.schemeId+'::'+SESSION.userId] = {enviado:true, fecha:new Date().toLocaleString('es-EC'), reabiertos:[]};
    logAudit(NAV.schemeId, null, null, 'envio', null);
    persist(true); MODAL={open:false, kind:null, payload:null}; render();
  };
  const downloadBtn=document.getElementById('downloadBtn'); if(downloadBtn) downloadBtn.onclick=()=>downloadResult(findScheme(NAV.schemeId), SESSION.userId);
  const printBtn=document.getElementById('printBtn'); if(printBtn) printBtn.onclick=()=>generateUserCertificate(NAV.schemeId, SESSION.userId);

  const requestReopenBtn=document.getElementById('requestReopenBtn');
  if(requestReopenBtn) requestReopenBtn.onclick=()=>{ MODAL={open:true, kind:'request-reopen', payload:{schemeId:NAV.schemeId}}; render(); };
  const confirmReopenBtn=document.getElementById('confirmReopenBtn');
  if(confirmReopenBtn) confirmReopenBtn.onclick=()=>{
    const sub = STATE.submissions[NAV.schemeId+'::'+SESSION.userId];
    if(sub){ sub.reabiertos=[]; sub.fecha=new Date().toLocaleString('es-EC'); }
    logAudit(NAV.schemeId, null, null, 'confirmacion', null);
    persist(true); toast('Cambios confirmados y reenviados'); render();
  };

  // modal genérico también aplica aquí (cerrar / cancelar / guardar solicitud)
  const modalOverlay=document.getElementById('modalOverlay');
  if(modalOverlay){
    modalOverlay.onclick=(e)=>{ if(e.target===modalOverlay) closeModal(); };
    const mcancel=document.getElementById('modalCancel'); if(mcancel) mcancel.onclick=closeModal;
    const mc=document.getElementById('modalClose'); if(mc) mc.onclick=closeModal;
    const reqSave=document.getElementById('reqSave');
    if(reqSave) reqSave.onclick=()=>{
      const mensaje=document.getElementById('reqMensaje').value.trim();
      STATE.reopenRequests.push({id:uid('req'), schemeId:MODAL.payload.schemeId, userId:SESSION.userId, mensaje, estado:'pendiente', alcance:null, fechaSolicitud:new Date().toLocaleString('es-EC'), fechaResolucion:null});
      persist(true); closeModal(); toast('Solicitud enviada al administrador');
    };
  }
}

/* =========================== BOOT =========================== */
(async function boot(){ await loadState(); render(); })();
</script>
