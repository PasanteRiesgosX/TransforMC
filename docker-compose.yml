version: '3.8'

services:
  db:
    image: postgres:15
    container_name: certifier_vista_cnt
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: certifier_vista_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
