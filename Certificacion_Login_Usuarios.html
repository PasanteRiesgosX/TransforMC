<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificación Vista 5.0 · Multicines</title>
<style>
:root{
  --bg:#F4F6FA; --card:#FFFFFF; --navy:#1E2233; --gray:#3A3F4A; --grayLight:#6E747A;
  --border:#E7EAF2; --cian:#00AEEF; --morado:#7C3AED; --magenta:#EC008C; --naranja:#F5A623;
  --teal:#00B39A; --verde:#8BC34A; --verdeAmarillo:#FFD54F; --naranjaFuerte:#FB8C00; --rojo:#E53935;
  --cian-bg:rgba(0,174,239,0.10); --morado-bg:rgba(124,58,237,0.10); --magenta-bg:rgba(236,0,140,0.10);
  --naranja-bg:rgba(245,166,35,0.12); --teal-bg:rgba(0,179,154,0.12); --rojo-bg:rgba(229,57,53,0.10);
  --radius-s:6px; --radius-m:10px; --radius-l:16px;
  --shadow:0 10px 28px rgba(30,34,51,0.10); --shadow-sm:0 2px 8px rgba(30,34,51,0.06);
  --font: Arial, Helvetica, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{ background:var(--bg); color:var(--gray); font-family:var(--font); font-size:14px; line-height:1.5; min-height:100vh; }
#app{min-height:100vh;}
::selection{ background:var(--cian); color:#fff; }
a{color:inherit;}
button{font-family:inherit; cursor:pointer;}
input,textarea,select{font-family:inherit; font-size:14px;}
.hidden{display:none !important;}

.signature-bar{ height:4px; display:flex; }
.signature-bar span{ flex:1; }
.sb-cian{background:var(--cian);} .sb-morado{background:var(--morado);} .sb-magenta{background:var(--magenta);} .sb-naranja{background:var(--naranja);}

/* ============ LANDING ============ */
.landing-wrap{ min-height:100vh; background:var(--navy); display:flex; flex-direction:column; }
.landing-body{ flex:1; display:flex; align-items:center; justify-content:center; padding:32px; }
.landing-inner{ max-width:560px; text-align:center; }
.landing-logo{ height:38px; margin-bottom:36px; }
.landing-title{ color:#fff; font-size:30px; font-weight:700; margin:0 0 14px; line-height:1.25; }
.landing-desc{ color:#AEB4C4; font-size:15px; line-height:1.6; margin:0 0 40px; }
.role-cards{ display:flex; gap:16px; flex-wrap:wrap; justify-content:center; }
.role-card{
  flex:1; min-width:210px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.14);
  border-radius:var(--radius-l); padding:28px 22px; text-align:left; transition:all .15s ease;
}
.role-card:hover{ background:rgba(255,255,255,0.08); border-color:var(--cian); transform:translateY(-2px); }
.role-card-icon{ width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; margin-bottom:16px; }
.role-card-title{ color:#fff; font-size:16px; font-weight:700; margin:0 0 6px; }
.role-card-desc{ color:#AEB4C4; font-size:12.5px; line-height:1.5; margin:0; }
.landing-foot{ padding:22px 32px; text-align:center; }
.landing-foot span{ color:#6E7690; font-size:11.5px; }

/* ============ LOGIN ============ */
.login-wrap{ min-height:100vh; display:flex; flex-direction:column; background:var(--navy); }
.login-topbar{ padding:20px 28px; }
.back-link{ display:inline-flex; align-items:center; gap:7px; color:#AEB4C4; font-size:13px; font-weight:700; background:none; border:none; padding:6px 4px; }
.back-link:hover{ color:#fff; }
.login-body{ flex:1; display:flex; align-items:center; justify-content:center; padding:20px; }
.login-card{ width:100%; max-width:400px; background:var(--card); border-radius:var(--radius-l); padding:36px 32px; box-shadow:var(--shadow); }
.login-role-badge{ display:inline-flex; align-items:center; gap:7px; padding:5px 12px; border-radius:20px; font-size:11.5px; font-weight:700; margin-bottom:18px; }
.login-title{ font-size:22px; font-weight:700; color:var(--navy); margin:0 0 6px; }
.login-desc{ color:var(--grayLight); font-size:13px; margin:0 0 24px; }
.field{margin-bottom:16px;}
.field label{ display:block; font-size:12px; font-weight:700; color:var(--gray); margin-bottom:6px; }
.field input, .field select, .field textarea{
  width:100%; background:#fff; border:1.5px solid var(--border); color:var(--navy);
  padding:10px 12px; border-radius:var(--radius-s); outline:none; transition:border-color .15s ease;
}
.field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--cian); }
.field .hint{font-size:11px; color:var(--grayLight); margin-top:5px;}
.btn{ border:none; border-radius:var(--radius-s); padding:11px 18px; font-weight:700; font-size:13.5px; transition:all .15s ease; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
.btn-primary{ background:var(--cian); color:#fff; width:100%; }
.btn-primary:hover{ filter:brightness(1.08); box-shadow:0 4px 14px rgba(0,174,239,0.35); }
.btn-primary:disabled{ opacity:0.4; cursor:not-allowed; }
.btn-ghost{ background:none; color:var(--gray); border:1.5px solid var(--border); }
.btn-ghost:hover{ color:var(--navy); border-color:var(--grayLight); }
.btn-outline{ background:none; color:var(--cian); border:1.5px solid var(--cian); }
.btn-outline:hover{ background:var(--cian-bg); }
.btn-warn{ background:var(--naranjaFuerte); color:#fff; }
.btn-warn:hover{ filter:brightness(1.06); }
.btn-danger{ background:var(--rojo); color:#fff; }
.btn-danger:hover{ filter:brightness(1.06); }
.btn-sm{ padding:7px 13px; font-size:12px; }
.login-demo{ margin-top:20px; padding:12px 14px; background:var(--bg); border:1px dashed var(--border); border-radius:var(--radius-s); font-size:11px; color:var(--grayLight); line-height:1.7; }
.login-demo b{color:var(--gray);}
.error-msg{ color:var(--rojo); font-size:12px; margin:-6px 0 14px; font-weight:600; }
.login-demo-role{padding-top:4px; margin-top:6px; border-top:1px dashed var(--border);}

/* ============ APP SHELL ============ */
.topbar{ height:60px; background:var(--navy); display:flex; align-items:center; justify-content:space-between; padding:0 24px; position:sticky; top:0; z-index:40; }
.topbar-left{display:flex; align-items:center; gap:16px;}
.topbar-logo{ height:22px; }
.topbar-crumb{ font-size:12px; color:#AEB4C4; padding-left:16px; border-left:1px solid rgba(255,255,255,0.15); }
.topbar-right{display:flex; align-items:center; gap:16px;}
.user-chip{display:flex; align-items:center; gap:9px; font-size:12.5px; color:#D6DAE5;}
.avatar{ width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:11px; color:#fff; flex-shrink:0; }
.avatar-lg{ width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; color:#fff; flex-shrink:0; }
.bg-cian{background:var(--cian);} .bg-morado{background:var(--morado);} .bg-magenta{background:var(--magenta);} .bg-naranja{background:var(--naranja);} .bg-teal{background:var(--teal);}
.tp-btn{ background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.16); color:#fff; padding:7px 14px; border-radius:20px; font-size:12px; font-weight:700; }
.tp-btn:hover{ background:rgba(255,255,255,0.16); }

.body-shell{display:flex; flex:1; min-height:calc(100vh - 60px);}
.sidebar{ width:224px; background:var(--card); border-right:1px solid var(--border); padding:18px 12px; flex-shrink:0; }
.side-item{ display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:var(--radius-s); color:var(--gray); font-size:13.5px; font-weight:700; margin-bottom:3px; border:1px solid transparent; }
.side-item:hover{ background:var(--bg); }
.side-item.active{ background:var(--cian-bg); color:var(--cian); }
.side-item-disabled{ color:var(--grayLight); cursor:default; opacity:0.55; }
.side-item-disabled:hover{ background:none; }
.side-icon{width:18px; text-align:center; font-size:14px;}

.content{flex:1; padding:28px 32px; max-width:1280px;}
.page-head{margin-bottom:22px;}
.page-title{ font-size:23px; font-weight:700; color:var(--navy); margin:0 0 5px; }
.page-sub{ color:var(--grayLight); font-size:13px; margin:0; max-width:760px; line-height:1.6; }

.panel{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius-l); padding:22px; box-shadow:var(--shadow-sm); }
.grid-4{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
.grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.grid-2{ display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
.stat-card{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius-m); padding:18px; box-shadow:var(--shadow-sm); }
.stat-num{ font-size:28px; font-weight:700; margin:0; color:var(--navy); }
.stat-label{ font-size:11.5px; color:var(--grayLight); margin-top:3px; font-weight:600; }

table{ width:100%; border-collapse:collapse; }
th{ text-align:left; font-size:11px; font-weight:700; color:var(--grayLight); padding:9px 12px; border-bottom:1.5px solid var(--border); text-transform:uppercase; letter-spacing:0.02em; }
td{ padding:11px 12px; border-bottom:1px solid var(--border); font-size:13.5px; color:var(--gray); }
tr:last-child td{ border-bottom:none; }
tr.row-hover:hover{ background:var(--bg); }

.tag{ display:inline-flex; align-items:center; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; }
.tag-cian{ background:var(--cian-bg); color:#0090C7; } .tag-morado{ background:var(--morado-bg); color:var(--morado); }
.tag-magenta{ background:var(--magenta-bg); color:var(--magenta); } .tag-naranja{ background:var(--naranja-bg); color:#B87200; }
.tag-teal{ background:var(--teal-bg); color:#00806E; } .tag-rojo{ background:var(--rojo-bg); color:var(--rojo); }
.tag-neutral{ background:var(--bg); color:var(--grayLight); border:1px solid var(--border); }

.progress-track{ height:8px; background:var(--bg); border-radius:20px; overflow:hidden; border:1px solid var(--border); }
.progress-fill{ height:100%; background:var(--cian); border-radius:20px; transition:width .3s ease; }
.progress-fill.pf-teal{ background:var(--teal); }
.progress-fill.pf-rojo{ background:var(--rojo); }

.toolbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:12px; flex-wrap:wrap; }
.toolbar-right{ display:flex; gap:10px; flex-wrap:wrap; }

.modal-overlay{ position:fixed; inset:0; background:rgba(20,22,33,0.55); backdrop-filter:blur(2px); display:flex; align-items:center; justify-content:center; z-index:100; padding:24px; }
.modal{ background:var(--card); border-radius:var(--radius-l); width:100%; max-width:520px; max-height:88vh; overflow-y:auto; padding:26px; box-shadow:var(--shadow); }
.modal-wide{ max-width:820px; }
.modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
.modal-title{ font-size:18px; font-weight:700; color:var(--navy); margin:0; }
.modal-close{ background:none; border:none; color:var(--grayLight); font-size:20px; line-height:1; padding:4px; }
.modal-close:hover{ color:var(--navy); }
.modal-foot{ display:flex; justify-content:flex-end; gap:10px; margin-top:22px; padding-top:18px; border-top:1px solid var(--border); }
.modal-warn-icon{ width:48px; height:48px; border-radius:50%; background:var(--naranja-bg); color:var(--naranjaFuerte); display:flex; align-items:center; justify-content:center; font-size:22px; margin:0 auto 16px; }

.toast{ position:fixed; bottom:26px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff; padding:11px 20px; border-radius:30px; font-size:13px; font-weight:700; box-shadow:var(--shadow); z-index:200; display:flex; align-items:center; gap:9px; opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease; }
.toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }
.toast-dot{width:7px; height:7px; border-radius:50%; background:var(--cian);}

.empty-state{ text-align:center; padding:50px 20px; color:var(--grayLight); }
.empty-state .es-icon{ font-size:32px; margin-bottom:12px; opacity:0.5; }
.empty-state .es-title{ color:var(--gray); font-size:14px; font-weight:700; margin-bottom:4px; }

.checkbox-row{ display:flex; align-items:center; gap:9px; }
.checkbox-row input{ width:16px; height:16px; accent-color:var(--cian); }
.icon-btn{ background:none; border:1px solid var(--border); color:var(--grayLight); width:26px; height:26px; border-radius:6px; font-size:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.icon-btn:hover{ color:var(--navy); border-color:var(--grayLight); }

.breadcrumbs{ display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--grayLight); margin-bottom:18px; flex-wrap:wrap; }
.breadcrumbs a{ color:var(--gray); cursor:pointer; font-weight:700; }
.breadcrumbs a:hover{ color:var(--cian); }
.breadcrumbs .sep{ opacity:0.5; }
.breadcrumbs .current{ color:var(--navy); font-weight:700; }

.filter-tabs{ display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
.filter-tab{ background:var(--card); border:1.5px solid var(--border); color:var(--gray); padding:8px 15px; border-radius:20px; font-size:12.5px; font-weight:700; }
.filter-tab:hover{ border-color:var(--cian); }
.filter-tab.active{ background:var(--navy); border-color:var(--navy); color:#fff; }

/* ============ tarjetas de módulo / catálogo ============ */
.cards-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:14px; }
.mod-card{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius-l); padding:20px; cursor:pointer; transition:all .15s ease; box-shadow:var(--shadow-sm); }
.mod-card:hover{ border-color:var(--cian); transform:translateY(-2px); box-shadow:var(--shadow); }
.mod-icon{ width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:19px; margin-bottom:14px; }
.mod-card-title{ font-weight:700; font-size:15px; color:var(--navy); margin-bottom:4px; }
.mod-card-meta{ font-size:11.5px; color:var(--grayLight); }

/* usuarios */
.user-card{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius-l); padding:18px; display:flex; flex-direction:column; gap:12px; box-shadow:var(--shadow-sm); transition:border-color .15s ease; }
.user-card:hover{ border-color:var(--cian); }
.user-card-top{ display:flex; align-items:center; gap:12px; }
.user-card-name{ font-weight:700; font-size:14.5px; color:var(--navy); }
.user-card-cargo{ font-size:12px; color:var(--grayLight); margin-top:1px; }
.user-card-mail{ font-size:11.5px; color:var(--grayLight); word-break:break-all; }
.user-card-foot{ display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:12px; border-top:1px solid var(--border); }
.user-card-tags{ display:flex; gap:6px; flex-wrap:wrap; }

/* resultados */
.progress-card{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius-l); padding:18px; cursor:pointer; transition:all .15s ease; box-shadow:var(--shadow-sm); }
.progress-card:hover{ border-color:var(--cian); transform:translateY(-1px); }
.progress-card-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:12px; }
.progress-card-title{ font-weight:700; font-size:14.5px; color:var(--navy); line-height:1.3; }
.progress-card-meta{ font-size:11.5px; color:var(--grayLight); margin-top:3px; }
.progress-card-pct{ font-size:21px; font-weight:700; color:var(--navy); flex-shrink:0; }
.progress-card-chips{ display:flex; gap:7px; margin-top:12px; flex-wrap:wrap; }

/* catálogo — detalle de módulo */
.sub-pill{ display:inline-flex; align-items:center; gap:6px; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-m); padding:10px 14px; margin:0 8px 8px 0; font-size:12.5px; font-weight:700; color:var(--gray); cursor:pointer; }
.sub-pill:hover{ border-color:var(--cian); color:var(--cian); }
.sub-pill.active{ background:var(--cian); border-color:var(--cian); color:#fff; }
.item-row{ display:flex; align-items:center; justify-content:space-between; padding:9px 12px; border-top:1px solid var(--border); font-size:13px; }
.item-row:first-child{ border-top:none; }
.item-row:hover{ background:var(--bg); }
.item-actions{ display:flex; gap:6px; opacity:0; transition:opacity .12s; }
.item-row:hover .item-actions{ opacity:1; }

/* picker de catálogo en esquemas */
.picker-tree{ max-height:460px; overflow-y:auto; border:1px solid var(--border); border-radius:var(--radius-m); padding:6px; }
.picker-mod{ border-bottom:1px solid var(--border); }
.picker-mod:last-child{border-bottom:none;}
.picker-mod-head{ display:flex; align-items:center; gap:9px; padding:10px 8px; font-weight:700; font-size:13px; color:var(--navy); }
.picker-sub-head{ display:flex; align-items:center; gap:9px; padding:7px 8px 7px 28px; font-weight:700; font-size:12px; color:var(--gray); }
.picker-item-row{ display:flex; align-items:center; gap:9px; padding:5px 8px 5px 48px; font-size:12px; color:var(--gray); }
.picker-item-row.taken{ opacity:0.55; }
.picker-item-taken-tag{ font-size:10px; color:var(--grayLight); margin-left:auto; }
.quick-assign{ background:none; border:none; color:var(--cian); font-size:11px; font-weight:700; margin-left:auto; padding:2px 6px; }
.quick-assign:hover{ text-decoration:underline; }

.paquete-card{ background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-m); padding:14px 16px; margin-bottom:10px; }
.paquete-card-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.paquete-name{ font-weight:700; font-size:13.5px; color:var(--navy); }
.paquete-meta{ font-size:11.5px; color:var(--grayLight); }
.paquete-users{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }

/* ============ certificación (usuario) ============ */
.cert-topbar{ position:sticky; top:60px; z-index:30; background:rgba(244,246,250,0.95); backdrop-filter:blur(6px); border-bottom:1px solid var(--border); padding:14px 32px; }
.cert-progress-row{ display:flex; align-items:center; gap:16px; max-width:1280px; }
.cert-progress-label{ font-size:12.5px; color:var(--navy); white-space:nowrap; font-weight:700; }
.cert-progress-track{ flex:1; }
.cert-progress-pct{ font-size:16px; font-weight:700; color:var(--cian); min-width:44px; text-align:right;}

.sub-block{ margin-bottom:28px; }
.sub-block-title{ font-size:12.5px; font-weight:700; color:var(--navy); margin:0 0 12px; padding-bottom:8px; border-bottom:2px solid var(--border); display:flex; align-items:center; gap:8px; text-transform:uppercase; letter-spacing:0.02em; }
.sub-block-count{ font-weight:600; color:var(--grayLight); text-transform:none; letter-spacing:0; font-size:11.5px; }

.item-card{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius-l); padding:18px 20px; margin-bottom:12px; box-shadow:var(--shadow-sm); }
.item-card-top{ display:flex; align-items:flex-start; gap:12px; margin-bottom:16px; }
.item-num{ width:24px; height:24px; border-radius:7px; background:var(--bg); color:var(--grayLight); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0; margin-top:1px; }
.item-name{ font-size:14px; font-weight:700; color:var(--navy); line-height:1.4; flex:1; }
.item-state-icon{ width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; flex-shrink:0; }

.eval-block{ background:var(--bg); border-radius:var(--radius-m); padding:14px 16px; margin-bottom:10px; }
.eval-block-label{ font-size:11.5px; font-weight:700; color:var(--gray); margin-bottom:10px; }
.eval-choice-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.eval-choice{ background:#fff; border:1.5px solid var(--border); border-radius:var(--radius-s); padding:11px 10px; font-size:12.5px; font-weight:700; color:var(--gray); display:flex; align-items:center; justify-content:center; gap:7px; transition:all .12s ease; }
.eval-choice:hover{ border-color:var(--grayLight); }
.eval-choice.on-teal{ background:var(--teal-bg); border-color:var(--teal); color:#00806E; }
.eval-choice.on-rojo{ background:var(--rojo-bg); border-color:var(--rojo); color:var(--rojo); }
.eval-choice.on-naranja{ background:var(--naranja-bg); border-color:var(--naranjaFuerte); color:#9A5B00; }
.eval-choice.on-neutral{ background:var(--bg); border-color:var(--grayLight); color:var(--gray); }

.item-comment-box{ background:var(--naranja-bg); border-radius:var(--radius-m); padding:14px 16px; margin-top:12px; display:grid; grid-template-columns:1fr auto; gap:14px; align-items:start; }
.item-comment-box.tone-rojo{ background:var(--rojo-bg); }
.item-comment-box textarea{ min-height:56px; resize:vertical; width:100%; border:1.5px solid transparent; background:#fff; border-radius:var(--radius-s); padding:9px 11px; outline:none; }
.item-comment-box textarea:focus{ border-color:var(--cian); }
.req-star{ color:var(--rojo); }
.file-btn{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; width:110px; height:56px; border:1.5px dashed var(--grayLight); border-radius:var(--radius-s); color:var(--grayLight); font-size:10.5px; text-align:center; position:relative; overflow:hidden; background:#fff; }
.file-btn input{ position:absolute; inset:0; opacity:0; cursor:pointer; }
.file-btn.has-file{ border-color:var(--teal); color:#00806E; border-style:solid; }

.readonly-banner{ display:flex; align-items:center; gap:12px; background:var(--teal-bg); border:1px solid var(--teal); border-radius:var(--radius-m); padding:14px 18px; margin-bottom:20px; }
.readonly-banner-icon{ width:32px; height:32px; border-radius:50%; background:var(--teal); color:#fff; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }
.ro-item-state{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; padding:6px 12px; border-radius:20px; }

/* tarjetas de campaña (usuario) */
.campaign-card{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius-l); padding:22px; box-shadow:var(--shadow-sm); transition:all .15s ease; display:flex; flex-direction:column; gap:16px; }
.campaign-card:hover{ box-shadow:var(--shadow); transform:translateY(-2px); }
.campaign-card-top{ display:flex; align-items:center; gap:14px; }
.campaign-ring-wrap{ position:relative; width:64px; height:64px; flex-shrink:0; }
.campaign-ring-pct{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; color:var(--navy); }
.campaign-title{ font-size:15.5px; font-weight:700; color:var(--navy); line-height:1.3; }
.campaign-meta{ font-size:11.5px; color:var(--grayLight); margin-top:3px; }
.campaign-stats{ display:flex; gap:8px; }
.campaign-cta{ margin-top:auto; }

.module-block{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius-l); padding:20px; margin-bottom:14px; box-shadow:var(--shadow-sm); }
.module-block-top{ display:flex; align-items:center; gap:14px; margin-bottom:14px; }
.module-block-title{ font-size:16px; font-weight:700; color:var(--navy); }
.module-block-meta{ font-size:11.5px; color:var(--grayLight); margin-top:2px; }
.sub-mini-row{ display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--border); }
.sub-mini-row:first-child{ border-top:none; }
.sub-mini-name{ width:200px; flex-shrink:0; font-size:12.5px; font-weight:600; color:var(--gray); }
.sub-mini-track{ flex:1; }
.sub-mini-pct{ font-size:11.5px; color:var(--grayLight); width:36px; text-align:right; }

.consol-summary{ display:flex; gap:14px; margin-bottom:22px; flex-wrap:wrap; }
.consol-chip{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius-m); padding:12px 18px; flex:1; min-width:120px; box-shadow:var(--shadow-sm); }
.consol-chip .n{ font-size:21px; font-weight:700; color:var(--navy); }
.consol-chip .l{ font-size:11px; color:var(--grayLight); margin-top:2px; font-weight:600; }

@media (max-width: 860px){
  .sidebar{ display:none; }
  .grid-4, .grid-3, .grid-2{ grid-template-columns:1fr; }
  .content{ padding:20px; }
  .cert-topbar, .topbar{ padding-left:16px; padding-right:16px; }
  .eval-choice-row{ grid-template-columns:1fr; }
  .role-cards{ flex-direction:column; }
}

/* ============ buscador ============ */
.search-wrap{ position:relative; margin-bottom:16px; }
.search-wrap input{ width:100%; background:#fff; border:1.5px solid var(--border); color:var(--navy); padding:10px 14px 10px 34px; border-radius:var(--radius-m); outline:none; font-size:13px; }
.search-wrap input:focus{ border-color:var(--cian); }
.search-wrap::before{ content:'🔍'; position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:12px; opacity:0.55; }

/* ============ tarjetas con falla resaltada / listas para producción ============ */
.progress-card.has-fail{ border-left:3px solid var(--rojo); }
.progress-card.is-ready{ border-left:3px solid var(--teal); }

/* ============ tarjeta bloqueada / reabierta ============ */
.locked-ribbon{ display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700; color:var(--grayLight); background:var(--bg); border:1px solid var(--border); border-radius:20px; padding:3px 10px; margin-bottom:8px; }
.item-card.reabierto{ border:1.5px solid var(--naranjaFuerte); }

/* ============ banners de estado ============ */
.banner{ display:flex; align-items:center; justify-content:space-between; gap:14px; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-m); padding:14px 18px; margin-bottom:18px; flex-wrap:wrap; }
.banner.banner-naranja{ border-color:var(--naranjaFuerte); background:var(--naranja-bg); }
.banner.banner-teal{ border-color:var(--teal); background:var(--teal-bg); }
.banner-text{ font-size:13px; color:var(--gray); }
.banner-text b{ display:block; font-size:13.5px; margin-bottom:2px; color:var(--navy); }

/* ============ tarjetas de solicitud de reapertura ============ */
.request-card{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius-l); padding:16px 18px; margin-bottom:12px; box-shadow:var(--shadow-sm); }
.request-card-top{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:8px; }
.request-card-msg{ font-size:12.5px; color:var(--gray); background:var(--bg); border-radius:var(--radius-s); padding:10px 12px; margin:8px 0 12px; }
.request-card-actions{ display:flex; gap:8px; flex-wrap:wrap; }

/* ============ diagrama comparativo pruebas vs producción ============ */
.diagram-mod{ margin-bottom:34px; }
.diagram-mod-head{ display:flex; align-items:center; gap:12px; margin-bottom:16px; }
.diagram-legend{ display:flex; gap:16px; font-size:11.5px; color:var(--gray); margin-bottom:20px; flex-wrap:wrap; }
.diagram-legend span{ display:flex; align-items:center; gap:6px; }
.dot{ width:8px; height:8px; border-radius:50%; }
.dot-teal{background:var(--teal);} .dot-rojo{background:var(--rojo);} .dot-gray{background:var(--grayLight);}
.diagram-children{ display:flex; gap:20px; flex-wrap:wrap; padding-top:14px; border-top:1.5px solid var(--border); }
.diagram-node{ display:flex; flex-direction:column; align-items:center; gap:8px; width:120px; }
.env-split{ display:flex; width:100%; height:52px; border-radius:12px; overflow:hidden; border:1px solid var(--border); cursor:pointer; transition:transform .1s ease; box-shadow:var(--shadow-sm); }
.env-split:hover{ transform:translateY(-2px); }
.env-half{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; }
.env-half-label{ font-size:8.5px; font-weight:800; letter-spacing:0.03em; opacity:0.8; }
.env-half-pct{ font-size:12px; font-weight:700; }
.env-half.st-ok{ background:var(--teal-bg); color:#00806E; }
.env-half.st-fail{ background:var(--rojo-bg); color:var(--rojo); }
.env-half.st-pending{ background:var(--bg); color:var(--grayLight); }
.env-half.st-na{ background:repeating-linear-gradient(135deg, var(--bg), var(--bg) 4px, var(--card) 4px, var(--card) 8px); color:var(--grayLight); }
.diagram-node-label{ font-size:11px; font-weight:600; text-align:center; line-height:1.3; color:var(--gray); }
.env-compare-row{ display:flex; align-items:center; gap:14px; padding:12px 16px; border-bottom:1px solid var(--border); }
.env-compare-row:last-child{ border-bottom:none; }
.env-compare-name{ flex:1.4; font-size:13px; font-weight:600; color:var(--navy); }
.env-compare-side{ flex:1; display:flex; align-items:center; gap:8px; }
.env-compare-side-label{ font-size:10px; font-weight:700; color:var(--grayLight); width:70px; }

/* ============ gestión de certificación (Mis resultados) ============ */
.mgmt-card{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius-l); padding:18px 20px; margin-bottom:14px; box-shadow:var(--shadow-sm); }
.mgmt-card-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:12px; flex-wrap:wrap; }
.mgmt-title{ font-weight:700; font-size:15px; color:var(--navy); }
.mgmt-meta{ font-size:12px; color:var(--grayLight); margin-top:2px; }
.mgmt-actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }

/* ============ semáforo gráfico ============ */
.semaphore{ display:inline-flex; flex-direction:column; gap:4px; background:#1E2233; border-radius:9px; padding:6px; flex-shrink:0; }
.semaphore-light{ width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,0.14); display:block; }
.semaphore-light.light-red.active{ background:#FF4D4D; box-shadow:0 0 7px #FF4D4D; }
.semaphore-light.light-yellow.active{ background:#FFC93C; box-shadow:0 0 7px #FFC93C; }
.semaphore-light.light-green.active{ background:#00E0A4; box-shadow:0 0 7px #00E0A4; }
.semaphore-lg{ padding:10px; border-radius:14px; gap:7px; }
.semaphore-lg .semaphore-light{ width:15px; height:15px; }
.semaphore-row{ display:flex; align-items:center; gap:12px; }
</style>
</head>

<script>

   (versión resumida: landing, login, cambio de clave, panel admin > usuarios)

const LOGO_WHITE = 'data:image/png;base64,' + document.getElementById('logo-white').textContent.trim();

const SEED_USERS = [
  {id:'u-admin', nombre:'David', apellido:'Mena', cargo:'Especialista de Procesos y Mejora Continua', correo:'david.mena@multicines.com', password:'admin2026', role:'admin', mustChange:false},

];

// ------- estado global -------
let STATE = { users: SEED_USERS };
let SESSION = null;
let LANDING_ROLE = null;   // 'user' | 'admin' — elegido en landing
let NAV = {view:'landing'};
let MODAL = {open:false, kind:null, payload:null};

const STORAGE_KEY = 'vista-cert-users-v1';
const DEFAULT_STATE = ()=>({users: JSON.parse(JSON.stringify(SEED_USERS))});

async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      const saved = JSON.parse(res.value);
      STATE = Object.assign(DEFAULT_STATE(), saved);
    }
  }catch(e){ /* sin estado guardado — se usa el seed */ }
}

let saveTimer = null;
function persist(showToast){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{ await window.storage.set(STORAGE_KEY, JSON.stringify(STATE), false); if(showToast) toast('Guardado'); }
    catch(e){ if(showToast) toast('No se pudo guardar (modo local)'); }
  }, 120);
}

function toast(msg){
  const t=document.getElementById('toast'); document.getElementById('toastMsg').textContent=msg;
  t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'), 2200);
}
function uid(p){ return p+'_'+Math.random().toString(36).slice(2,9); }
function initials(u){ return (u.nombre[0]+u.apellido[0]).toUpperCase(); }
function findUser(id){ return STATE.users.find(u=>u.id===id); }
const ACCENTS = ['cian','morado','magenta','naranja','teal'];
function accentFor(id){ let h=0; for(let i=0;i<id.length;i++) h=(h*31+id.charCodeAt(i))%997; return ACCENTS[h%ACCENTS.length]; }

/* =========================== RENDER ROUTER =========================== */

function render(){
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;

  const app = document.getElementById('app');
  if(!SESSION){
    if(NAV.view==='landing'){ app.innerHTML = renderLanding(); attachLandingEvents(); return restoreFocus(); }
    if(NAV.view==='login'){ app.innerHTML = renderLogin(); attachLoginEvents(); return restoreFocus(); }
  }
  if(SESSION && SESSION.forceChange){ app.innerHTML = renderForceChange(); attachForceChangeEvents(); return restoreFocus(); }
  if(SESSION && SESSION.role==='admin'){ app.innerHTML = renderAdminShell(); attachAdminEvents(); return restoreFocus(); }
  if(SESSION && SESSION.role==='user'){ app.innerHTML = renderUserHome(); attachUserHomeEvents(); return restoreFocus(); }
  app.innerHTML = renderLanding(); attachLandingEvents();

  function restoreFocus(){
    if(activeId){
      const el = document.getElementById(activeId);
      if(el && (el.tagName==='INPUT' || el.tagName==='TEXTAREA')){
        el.focus();
        if(selStart!==null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selStart); }catch(e){} }
      }
    }
  }
}

            <div class="role-card-desc">Gestiono usuarios, el catálogo de certificación, los esquemas de evaluación y reviso los resultados.</div>
          </div>
          <div class="role-card" data-choose-role="user">
            <div class="role-card-icon bg-cian">✓</div>
            <div class="role-card-title">Soy certificador</div>
            <div class="role-card-desc">Voy a certificar los módulos y secciones que me fueron asignados.</div>
          </div>
        </div>
      </div>
    </div>
    <div class="landing-foot"><span>Multicines S.A. · Riesgos y Control Interno</span></div>
  </div>`;
}
function attachLandingEvents(){
  document.querySelectorAll('[data-choose-role]').forEach(el=>{
    el.onclick = ()=>{ LANDING_ROLE = el.dataset.chooseRole; NAV = {view:'login'}; render(); };
  });
}

/* =============================== LOGIN =============================== */

function renderLogin(){
  const isAdmin = LANDING_ROLE==='admin';
  return `
  <div class="login-wrap">
    <div class="signature-bar"><span class="sb-cian"></span><span class="sb-morado"></span><span class="sb-magenta"></span><span class="sb-naranja"></span></div>
    <div class="login-topbar"><button class="back-link" id="backToLanding">← Volver</button></div>
    <div class="login-body">
      <div class="login-card">
        <div class="login-role-badge ${isAdmin?'tag-morado':'tag-cian'}" style="display:inline-flex;">${isAdmin?'⚙️ Acceso administrador':'✓ Acceso certificador'}</div>
        <h1 class="login-title">Iniciar sesión</h1>
        <p class="login-desc">Ingresa con tu correo y contraseña de Multicines.</p>
        <div class="field"><label>Correo</label><input id="loginEmail" type="text" placeholder="nombre.apellido@multicines.com" autocomplete="username"></div>
        <div class="field"><label>Contraseña</label><input id="loginPass" type="password" placeholder="••••••••" autocomplete="current-password"></div>
        <div id="loginError" class="error-msg hidden"></div>
        <button id="loginBtn" class="btn btn-primary">Ingresar</button>
        <div class="login-demo">
          ${isAdmin
            ? `<b>Acceso demo</b> — david.mena@multicines.com / admin2026`
            : `<b>Acceso demo</b> — sara.espinosa@multicines.com / Multicines2026 (pide cambio de clave)<div class="login-demo-role">vanessa.tapia@multicines.com / Multicines2026</div>`}
        </div>
      </div>
    </div>
  </div>`;
}
function attachLoginEvents(){
  document.getElementById('backToLanding').onclick = ()=>{ NAV={view:'landing'}; render(); };
  document.getElementById('loginBtn').onclick = doLogin;
  document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
}
function doLogin(){
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const pass = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginError');
  const u = STATE.users.find(x=>x.correo.toLowerCase()===email && x.password===pass);
  if(!u){ errEl.textContent='Correo o contraseña incorrectos.'; errEl.classList.remove('hidden'); return; }
  if((u.role==='admin') !== (LANDING_ROLE==='admin')){ errEl.textContent='Esa cuenta no corresponde al tipo de acceso elegido.'; errEl.classList.remove('hidden'); return; }
  SESSION = {userId:u.id, role:u.role, forceChange:!!u.mustChange};
  NAV = {view: u.role==='admin' ? 'admin-users' : 'user-home'};
  render();
}

function renderForceChange(){
  return `
  <div class="login-wrap">
    <div class="signature-bar"><span class="sb-cian"></span><span class="sb-morado"></span><span class="sb-magenta"></span><span class="sb-naranja"></span></div>
    <div class="login-body">
      <div class="login-card">
        <h1 class="login-title">Crea tu contraseña</h1>
        <p class="login-desc">Este es tu primer ingreso. Antes de continuar, define una contraseña propia que solo tú conozcas.</p>
        <div class="field"><label>Nueva contraseña</label><input id="npass1" type="password" placeholder="Mínimo 8 caracteres"></div>
        <div class="field"><label>Confirmar contraseña</label><input id="npass2" type="password" placeholder="Repite la contraseña"></div>
        <div id="fcError" class="error-msg hidden"></div>
        <button id="fcBtn" class="btn btn-primary">Guardar y continuar</button>
      </div>
    </div>
  </div>`;
}
function attachForceChangeEvents(){
  document.getElementById('fcBtn').onclick = ()=>{
    const p1=document.getElementById('npass1').value, p2=document.getElementById('npass2').value;
    const err=document.getElementById('fcError');
    if(p1.length<8){ err.textContent='La contraseña debe tener al menos 8 caracteres.'; err.classList.remove('hidden'); return; }
    if(p1!==p2){ err.textContent='Las contraseñas no coinciden.'; err.classList.remove('hidden'); return; }
    const u=findUser(SESSION.userId); u.password=p1; u.mustChange=false; SESSION.forceChange=false;
    persist(false); render();
  };
}
function logout(){ SESSION=null; LANDING_ROLE=null; NAV={view:'landing'}; render(); }

function topbar(crumb){
  const u = findUser(SESSION.userId);
  return `
  <div class="topbar">
    <div class="topbar-left"><img class="topbar-logo" src="${LOGO_WHITE}" alt="Multicines"><span class="topbar-crumb">${crumb||''}</span></div>
    <div class="topbar-right">
      <div class="user-chip"><div class="avatar bg-${accentFor(u.id)}">${initials(u)}</div>${u.nombre} ${u.apellido}</div>
      <button class="tp-btn" id="logoutBtn">Salir</button>
    </div>
  </div>`;
}

/* =========================== ADMIN SHELL =========================== */

const ADMIN_TABS = [
  {id:'admin-users', icon:'◆', label:'Usuarios'},
  {id:'admin-catalog', icon:'▤', label:'Catálogo'},
  {id:'admin-schemes', icon:'◈', label:'Esquemas de evaluación'},
  {id:'admin-results', icon:'▲', label:'Resultados'},
  {id:'admin-requests', icon:'✋', label:'Solicitudes'},
];
// única pestaña con contenido en este flujo resumido
const ADMIN_TABS_ENABLED = ['admin-users'];

function renderAdminShell(){
  const body = renderAdminUsers();
  return `
  ${topbar('Panel de administración')}
  <div class="body-shell">
    <div class="sidebar">
      ${ADMIN_TABS.map(t=>`<div class="side-item ${NAV.view===t.id?'active':''} ${ADMIN_TABS_ENABLED.includes(t.id)?'':'side-item-disabled'}" data-tab="${t.id}"><span class="side-icon">${t.icon}</span>${t.label}</div>`).join('')}
    </div>
    <div class="content">${body}</div>
  </div>
  ${MODAL.open ? renderModal() : ''}`;
}
function attachAdminEvents(){
  document.getElementById('logoutBtn').onclick = logout;
  // solo la pestaña "Usuarios" navega; el resto queda visible pero inactiva (sin contenido aún)
  document.querySelectorAll('.side-item').forEach(el=>{
    if(ADMIN_TABS_ENABLED.includes(el.dataset.tab)){
      el.onclick = ()=>{ NAV={view:el.dataset.tab}; render(); };
    }
  });
  attachViewSpecificEvents();
}

/* ---------------- ADMIN · USUARIOS ---------------- */

function renderAdminUsers(){
  const cards = STATE.users.map(u=>`
    <div class="user-card">
      <div class="user-card-top">
        <div class="avatar-lg bg-${accentFor(u.id)}">${initials(u)}</div>
        <div><div class="user-card-name">${u.nombre} ${u.apellido}</div><div class="user-card-cargo">${u.cargo}</div></div>
      </div>
      <div class="user-card-mail">${u.correo}</div>
      <div class="user-card-foot">
        <div class="user-card-tags">
          ${u.role==='admin'?'<span class="tag tag-morado">Administrador</span>':'<span class="tag tag-neutral">Usuario</span>'}
          ${u.mustChange?'<span class="tag tag-naranja">Clave pendiente</span>':'<span class="tag tag-teal">Activo</span>'}
        </div>
        <div style="display:flex; gap:6px;">
          <button class="icon-btn" data-edit-user="${u.id}" title="Editar usuario">✎</button>
          ${u.id!=='u-admin'?`<button class="icon-btn" data-del-user="${u.id}" title="Eliminar usuario">✕</button>`:''}
        </div>
      </div>
    </div>`).join('');
  return `
    <div class="page-head"><h1 class="page-title">Usuarios</h1><p class="page-sub">Aquí creas y administras las cuentas de las personas que van a certificar. Nadie puede registrarse por su cuenta: tú les das una contraseña genérica y ellos la cambian en su primer ingreso.</p></div>
    <div class="toolbar"><div></div><div class="toolbar-right"><button class="btn btn-primary" id="newUserBtn">+ Nuevo usuario</button></div></div>
    <div class="cards-grid">${cards}</div>`;
}
function renderModalNewUser(){
  return `
    <div class="modal-head"><h3 class="modal-title">Nuevo usuario</h3><button class="modal-close" id="modalClose">✕</button></div>
    <div class="field"><label>Nombre</label><input id="nuNombre" placeholder="Nombre"></div>
    <div class="field"><label>Apellido</label><input id="nuApellido" placeholder="Apellido"></div>
    <div class="field"><label>Cargo</label><input id="nuCargo" placeholder="Ej. Analista de Programación"></div>
    <div class="field"><label>Correo</label><input id="nuCorreo" placeholder="nombre.apellido@multicines.com"></div>
    <div class="field"><label>Tipo de perfil</label>
      <select id="nuRole"><option value="user">Usuario (certificador)</option><option value="admin">Administrador</option></select>
    </div>
    <div class="field"><label>Contraseña genérica</label><input id="nuPass" value="Multicines2026"><div class="hint">Se le pedirá cambiarla en su primer ingreso.</div></div>
    <div id="nuError" class="error-msg hidden"></div>
    <div class="modal-foot"><button class="btn btn-ghost" id="modalCancel">Cancelar</button><button class="btn btn-primary" id="nuSave">Crear usuario</button></div>`;
}
function renderModalEditUser(){
  const u = MODAL.payload;
  return `
    <div class="modal-head"><h3 class="modal-title">Editar usuario</h3><button class="modal-close" id="modalClose">✕</button></div>
    <div class="field"><label>Nombre</label><input id="euNombre" value="${u.nombre}"></div>
    <div class="field"><label>Apellido</label><input id="euApellido" value="${u.apellido}"></div>
    <div class="field"><label>Cargo</label><input id="euCargo" value="${u.cargo}"></div>
    <div class="field"><label>Correo</label><input id="euCorreo" value="${u.correo}"></div>
    <div class="field"><label>Tipo de perfil</label>
      <select id="euRole" ${u.id==='u-admin'?'disabled':''}>
        <option value="user" ${u.role==='user'?'selected':''}>Usuario (certificador)</option>
        <option value="admin" ${u.role==='admin'?'selected':''}>Administrador</option>
      </select>
      ${u.id==='u-admin'?'<div class="hint">Esta es tu propia cuenta de administrador y no se puede cambiar de tipo.</div>':''}
    </div>
    <div id="euError" class="error-msg hidden"></div>
    <div class="modal-foot"><button class="btn btn-ghost" id="modalCancel">Cancelar</button><button class="btn btn-primary" id="euSave">Guardar cambios</button></div>`;
}

function renderModal(){
  let inner = '';
  if(MODAL.kind==='new-user') inner = renderModalNewUser();
  else if(MODAL.kind==='edit-user') inner = renderModalEditUser();
  return `<div class="modal-overlay" id="modalOverlay"><div class="modal">${inner}</div></div>`;
}
function closeModal(){ MODAL = {open:false, kind:null, payload:null}; render(); }

function attachViewSpecificEvents(){
  const newUserBtn=document.getElementById('newUserBtn');
  if(newUserBtn) newUserBtn.onclick=()=>{ MODAL={open:true, kind:'new-user'}; render(); };
  document.querySelectorAll('[data-edit-user]').forEach(el=>{ el.onclick=()=>{ MODAL={open:true, kind:'edit-user', payload:findUser(el.dataset.editUser)}; render(); }; });
  document.querySelectorAll('[data-del-user]').forEach(el=>{ el.onclick=()=>{ if(confirm('¿Eliminar este usuario?')){ STATE.users=STATE.users.filter(u=>u.id!==el.dataset.delUser); persist(true); render(); } }; });

  const modalOverlay=document.getElementById('modalOverlay');
  if(modalOverlay){
    modalOverlay.onclick=(e)=>{ if(e.target===modalOverlay) closeModal(); };
    const mc=document.getElementById('modalClose'); if(mc) mc.onclick=closeModal;
    const mcancel=document.getElementById('modalCancel'); if(mcancel) mcancel.onclick=closeModal;

    const nuSave=document.getElementById('nuSave');
    if(nuSave) nuSave.onclick=()=>{
      const nombre=document.getElementById('nuNombre').value.trim(), apellido=document.getElementById('nuApellido').value.trim();
      const cargo=document.getElementById('nuCargo').value.trim(), correo=document.getElementById('nuCorreo').value.trim();
      const role=document.getElementById('nuRole').value, pass=document.getElementById('nuPass').value;
      const err=document.getElementById('nuError');
      if(!nombre||!apellido||!correo){ err.textContent='Completa nombre, apellido y correo.'; err.classList.remove('hidden'); return; }
      if(STATE.users.some(u=>u.correo.toLowerCase()===correo.toLowerCase())){ err.textContent='Ya existe un usuario con ese correo.'; err.classList.remove('hidden'); return; }
      STATE.users.push({id:uid('u'), nombre, apellido, cargo, correo, password:pass||'Multicines2026', role, mustChange:true});
      persist(true); toast('Usuario creado'); closeModal();
    };
    const euSave=document.getElementById('euSave');
    if(euSave) euSave.onclick=()=>{
      const u=MODAL.payload; const correo=document.getElementById('euCorreo').value.trim(); const err=document.getElementById('euError');
      if(STATE.users.some(x=>x.id!==u.id && x.correo.toLowerCase()===correo.toLowerCase())){ err.textContent='Ya existe otro usuario con ese correo.'; err.classList.remove('hidden'); return; }
      u.nombre=document.getElementById('euNombre').value.trim(); u.apellido=document.getElementById('euApellido').value.trim();
      u.cargo=document.getElementById('euCargo').value.trim(); u.correo=correo;
      if(u.id!=='u-admin') u.role=document.getElementById('euRole').value;
      persist(true); toast('Cambios guardados'); closeModal();
    };
  }
}
